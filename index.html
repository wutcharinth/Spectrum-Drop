<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a14">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<title>Spectrum Drop</title>
<style>
  :root {
    --c-red:#ff453a; --c-green:#30d158; --c-blue:#0a84ff;
    --c-yellow:#ffd60a; --c-purple:#bf5af2; --c-cyan:#64d2ff; --c-white:#f5f5f7;
    --bg-0:#0a0a14; --bg-1:#1a1a2e;
    --glass-bg: rgba(255,255,255,0.055);
    --glass-border: rgba(255,255,255,0.12);
    --glass-hi: rgba(255,255,255,0.28);
    --panel: rgba(16,16,28,0.82);
    --text:#f5f5f7;
    --accent:#30d158;
    --radius:16px;
    --spectrum: linear-gradient(90deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a14 70%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex; justify-content: center; align-items: flex-start;
    padding: calc(14px + env(safe-area-inset-top)) 12px env(safe-area-inset-bottom);
  }

  /* ---------- animated background ---------- */
  .sd-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .sd-blob {
    position: absolute; width: 70vw; height: 70vw; max-width: 560px; max-height: 560px;
    border-radius: 50%; filter: blur(70px); opacity: 0.16; will-change: transform;
  }
  .sd-blob.b1 { background: var(--c-red); top: -18%; left: -18%; animation: drift1 19s ease-in-out infinite; }
  .sd-blob.b2 { background: var(--c-blue); bottom: -22%; right: -16%; animation: drift2 23s ease-in-out infinite; }
  .sd-blob.b3 { background: var(--c-purple); top: 28%; right: -22%; animation: drift3 27s ease-in-out infinite; }
  .sd-blob.b4 { background: var(--c-green); bottom: 6%; left: -20%; animation: drift1 31s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(18vw,12vh) scale(1.12)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-14vw,-10vh) scale(1.1)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-16vw,14vh) scale(0.9)} }

  body.flashing::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 200;
    animation: screen-flash 0.6s ease-out;
  }
  @keyframes screen-flash {
    0% { background: rgba(255,255,255,0); }
    25% { background: rgba(255,255,255,0.55); }
    100% { background: rgba(255,255,255,0); }
  }
  .sd-wrap { max-width: min(460px, calc((100vh - 175px) * 0.6)); width: 100%; position: relative; }

  /* ---------- HUD ---------- */
  .sd-hud {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-bottom: 8px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 6px 22px rgba(0,0,0,0.35);
  }
  .sd-hud-top { display: flex; align-items: center; gap: 8px; }
  .sd-hud-sub {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-top: 8px;
  }
  .sd-icon-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%; color: var(--text);
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, background 0.12s, color 0.15s;
  }
  .sd-icon-btn svg { width: 19px; height: 19px; display: block; }
  .sd-icon-btn:hover { background: rgba(255,255,255,0.12); }
  .sd-icon-btn:active { transform: scale(0.88); }
  .sd-icon-btn.muted { color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.03); }
  .sd-score-block { flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .sd-score {
    font-size: clamp(24px, 7vw, 34px); font-weight: 800;
    letter-spacing: -0.02em; line-height: 1;
    font-variant-numeric: tabular-nums;
    background: var(--spectrum);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sd-best-line { font-size: 9px; opacity: 0.5; letter-spacing: 0.14em; font-weight: 700; margin-top: 3px; }
  .sd-best-line span { font-variant-numeric: tabular-nums; }
  .sd-pulse { animation: score-pulse 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes score-pulse {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(1.16); filter: brightness(1.6) drop-shadow(0 0 12px rgba(255,214,10,0.7)); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .sd-logo-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    background: transparent; border: none; padding: 0; margin: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), filter 0.15s;
  }
  .sd-logo-btn svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45)); }
  .sd-logo-btn:hover { filter: brightness(1.15) drop-shadow(0 0 8px rgba(255,255,255,0.25)); }
  .sd-logo-btn:active { transform: scale(0.85) rotate(-25deg); }

  /* rise ring */
  .sd-rise-ring {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%;
    background: conic-gradient(var(--accent) var(--pct, 100%), rgba(255,255,255,0.08) 0);
    display: flex; align-items: center; justify-content: center; position: relative;
    transition: background 0.3s;
  }
  .sd-rise-ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #12121f; }
  .sd-rise-num { position: relative; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .sd-rise-ring.warn { --accent: var(--c-red); animation: ring-warn 0.7s ease-in-out infinite; }
  .sd-rise-ring.warn .sd-rise-num { color: var(--c-red); }
  @keyframes ring-warn { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1); filter:drop-shadow(0 0 8px rgba(255,69,58,0.7))} }

  .sd-queue { display: flex; align-items: center; gap: 6px; }
  .sd-queue-label { font-size: 9px; opacity: 0.45; letter-spacing: 0.14em; font-weight: 700; margin-right: 1px; }
  .sd-tile-mini {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; position: relative; flex-shrink: 0;
    background-image: linear-gradient(155deg, rgba(255,255,255,0.32), rgba(255,255,255,0) 42%, rgba(0,0,0,0.22));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 6px rgba(0,0,0,0.4);
  }
  .sd-tile-mini.empty {
    background-image: none; background: rgba(255,255,255,0.04);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .sd-tile-mini.q1 { opacity: 0.78; transform: scale(0.92); }
  .sd-tile-mini.q2 { opacity: 0.55; transform: scale(0.84); }
  .sd-tile-mini.wild {
    background-image: none !important;
    background: linear-gradient(45deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a) !important;
    background-size: 400% 400% !important; animation: rainbow 2.5s linear infinite;
    color: #fff !important;
  }
  .sd-mini-num { position: relative; z-index: 2; }
  .sd-wild-mark { display: flex; align-items: center; justify-content: center; width: 64%; height: 64%; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .sd-wild-mark svg { width: 100%; height: 100%; }
  .sd-bomb-badge { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; z-index: 4; }
  .sd-bomb-badge svg { width: 100%; height: 100%; }
  .sd-tile-mini .sd-bomb-badge { width: 13px; height: 13px; top: -4px; right: -4px; }

  /* ---------- play area ---------- */
  .sd-play-area { touch-action: none; -webkit-touch-callout: none; }
  .sd-preview-row {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    margin-bottom: 4px; padding: 0 6px; min-height: 42px;
  }
  .sd-preview-cell {
    aspect-ratio: 1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(12px, 3vw, 15px);
    transition: opacity 0.12s; opacity: 0; cursor: pointer; position: relative;
  }
  .sd-preview-cell.active { opacity: 0.95; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  .sd-grid-wrap { position: relative; }
  .sd-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    padding: 6px; background: rgba(0,0,0,0.42);
    border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.06);
    position: relative; transition: box-shadow 0.3s;
    box-shadow: inset 0 2px 20px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .sd-grid.warning { animation: grid-warn 0.8s ease-in-out infinite; }
  @keyframes grid-warn {
    0%,100% { box-shadow: 0 0 0 2px #ff453a, 0 0 20px rgba(255,69,58,0.4), inset 0 2px 20px rgba(0,0,0,0.55); }
    50% { box-shadow: 0 0 0 3px #ff453a, 0 0 40px rgba(255,69,58,0.75), inset 0 2px 20px rgba(0,0,0,0.55); }
  }
  .sd-grid.shaking { animation: shake 0.45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    10%,30%,50%,70%,90% { transform: translateX(-5px); }
    20%,40%,60%,80% { transform: translateX(5px); }
  }
  .sd-grid.wiggle { animation: wiggle 0.65s ease-in-out; }
  @keyframes wiggle {
    0%,100%{transform:rotate(0)} 18%{transform:rotate(-2.2deg)} 38%{transform:rotate(2.2deg)}
    58%{transform:rotate(-1.6deg)} 78%{transform:rotate(1deg)}
  }
  .sd-cell {
    aspect-ratio: 1; background: rgba(255,255,255,0.025); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: background 0.15s;
  }
  .sd-cell:hover { background: rgba(255,255,255,0.06); }
  .sd-tile {
    width: 92%; height: 92%; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(11px, 3vw, 17px);
    background-image: linear-gradient(155deg, rgba(255,255,255,0.34), rgba(255,255,255,0) 44%, rgba(0,0,0,0.22));
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), inset 0 -3px 7px rgba(0,0,0,0.28), 0 3px 9px rgba(0,0,0,0.42);
    line-height: 1; position: relative;
  }
  .sd-num { position: relative; z-index: 2; }
  .sd-tile.new { animation: pop 0.32s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .sd-tile.wild {
    background-image: none !important;
    background: linear-gradient(45deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a) !important;
    background-size: 400% 400% !important; animation: rainbow 2.5s linear infinite;
    color: #fff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .sd-tile.wild.new { animation: rainbow 2.5s linear infinite, pop 0.32s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
  .sd-tile.bomb { box-shadow: 0 0 0 2px #ff453a, 0 0 14px rgba(255,69,58,0.6), inset 0 1px 0 rgba(255,255,255,0.3); }

  /* googly faces */
  .sd-face {
    position: absolute; top: 20%; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: center; gap: 16%; pointer-events: none;
  }
  .sd-face i {
    width: 24%; max-width: 11px; aspect-ratio: 1; background: #fff; border-radius: 50%;
    position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .sd-face i::after {
    content: ''; position: absolute; width: 46%; height: 46%; background: #14141f; border-radius: 50%;
    left: 50%; top: 50%; animation: googly 2.6s ease-in-out infinite;
  }
  .sd-face i:nth-child(2)::after { animation-delay: -0.6s; }
  @keyframes googly {
    0%,100% { transform: translate(-85%,-35%); }
    25% { transform: translate(-15%,-75%); }
    50% { transform: translate(-30%,-5%); }
    75% { transform: translate(-75%,-65%); }
  }
  .sd-grid.warning .sd-face i::after { animation-duration: 0.45s; }
  .sd-grid.warning .sd-tile .sd-face::after {
    content: ''; position: absolute; right: 16%; top: 90%;
    width: 5px; height: 7px; background: var(--c-cyan); border-radius: 0 60% 60% 60%;
    transform: rotate(40deg); animation: sweat 1.1s ease-in infinite;
  }
  @keyframes sweat { 0%{opacity:0; transform:rotate(40deg) translateY(-2px)} 40%{opacity:0.9} 100%{opacity:0; transform:rotate(40deg) translateY(6px)} }

  /* particles + trail */
  .sd-particle-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: var(--radius); z-index: 5; }
  .sd-particle { position: absolute; width: 8px; height: 8px; border-radius: 2px; opacity: 0; pointer-events: none; will-change: transform, opacity; top: 0; left: 0; }
  .sd-trail {
    position: absolute; top: 6px; width: 5px; height: calc(100% - 12px);
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.55) 50%, transparent);
    border-radius: 4px; pointer-events: none; z-index: 4;
    animation: trail-fade 0.42s ease-out forwards; box-shadow: 0 0 12px rgba(255,255,255,0.4);
  }
  @keyframes trail-fade {
    0% { opacity: 0; transform: translateY(-30%) scaleY(0.4); }
    25% { opacity: 1; transform: translateY(0) scaleY(1); }
    100% { opacity: 0; transform: translateY(20%) scaleY(0.7); }
  }

  /* combo meter */
  .sd-combo-meter {
    position: absolute; top: 10px; left: 50%; transform: translate(-50%,-14px);
    z-index: 7; pointer-events: none; width: 64%; max-width: 240px;
    background: rgba(10,10,20,0.72); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border); border-radius: 12px;
    padding: 7px 12px 9px; opacity: 0; transition: opacity 0.18s, transform 0.18s;
    text-align: center;
  }
  .sd-combo-meter.show { opacity: 1; transform: translate(-50%,0); }
  .sd-combo-row { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
  .sd-combo-label { font-size: 10px; letter-spacing: 0.2em; font-weight: 800; opacity: 0.7; }
  .sd-combo-x { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .sd-combo-track { height: 5px; background: rgba(255,255,255,0.12); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .sd-combo-fill { height: 100%; width: 0%; border-radius: 3px; background: #fff; transition: width 0.2s ease, background 0.2s; }
  .sd-combo-meter.lv2 .sd-combo-fill { background: var(--c-yellow); }
  .sd-combo-meter.lv2 .sd-combo-x { color: var(--c-yellow); }
  .sd-combo-meter.lv3 .sd-combo-fill { background: linear-gradient(90deg,#ffd60a,#ff8a00); }
  .sd-combo-meter.lv3 .sd-combo-x { color: #ff9f0a; }
  .sd-combo-meter.lv4 .sd-combo-fill { background: var(--spectrum); }
  .sd-combo-meter.lv4 .sd-combo-x { background: var(--spectrum); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* toast / announcer */
  .sd-toast {
    position: absolute; top: 12px; left: 50%; transform: translate(-50%,-12px);
    z-index: 8; pointer-events: none; padding: 7px 15px; border-radius: 999px;
    background: rgba(10,10,20,0.8); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border); font-weight: 800; font-size: 14px;
    color: #fff; opacity: 0; transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  .sd-toast.show { opacity: 1; transform: translate(-50%,0); animation: toast-pop 0.42s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes toast-pop { 0%{transform:translate(-50%,0) scale(0.6)} 60%{transform:translate(-50%,0) scale(1.12)} 100%{transform:translate(-50%,0) scale(1)} }
  .sd-toast.warn { color: var(--c-red); border-color: rgba(255,69,58,0.5); }
  .sd-toast.rainbow { background: var(--spectrum); color: #0a0a14; border-color: transparent; }
  .sd-toast.best { background: linear-gradient(90deg,#ffd60a,#ff9f0a); color: #1c1c1e; border-color: transparent; }

  /* ---------- overlays ---------- */
  .sd-overlay {
    position: absolute; inset: 0;
    background: rgba(6,6,12,0.82);
    backdrop-filter: blur(13px); -webkit-backdrop-filter: blur(13px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    border-radius: var(--radius); z-index: 10; gap: 5px; padding: 22px 18px;
    border: 1px solid var(--glass-border);
  }
  .sd-overlay.show { display: flex; }
  #sd-start { z-index: 12; }
  #sd-help { z-index: 20; }
  .sd-overlay-logo {
    width: 60px; height: 60px; margin-bottom: 6px;
    animation: overlay-in 0.55s cubic-bezier(0.34,1.56,0.64,1);
    filter: drop-shadow(0 4px 16px rgba(255,255,255,0.18));
  }
  .sd-start-logo {
    width: 88px; height: 88px; margin-bottom: 10px; cursor: pointer;
    animation: float-logo 3.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 22px rgba(120,120,255,0.3));
  }
  @keyframes float-logo { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-10px) rotate(3deg)} }
  .sd-start-logo:active { transform: scale(0.9); }
  @keyframes overlay-in { 0% { opacity: 0; transform: translateY(-14px) scale(0.85); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  .sd-overlay h1, .sd-overlay h2 {
    margin: 0; background: var(--spectrum);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800; letter-spacing: 0.04em;
  }
  .sd-start-title { font-size: 30px; }
  .sd-overlay h2 { font-size: 26px; }
  .sd-start-tag { font-size: 12px; opacity: 0.6; margin: 6px 0 2px; text-align: center; }
  .sd-start-best, .sd-overlay-best { font-size: 12px; opacity: 0.6; margin: 6px 0 0; letter-spacing: 0.06em; }
  .sd-start-best span, .sd-overlay-best span { font-weight: 800; font-variant-numeric: tabular-nums; }
  .sd-overlay-meta { font-size: 13px; opacity: 0.7; margin: 8px 0 0; text-align: center; max-width: 240px; min-height: 17px; font-weight: 600; }
  .sd-overlay-score { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: #fff; margin: 2px 0 0; text-shadow: 0 2px 12px rgba(255,255,255,0.15); }
  .sd-crown { width: 34px; height: 34px; color: var(--c-yellow); filter: drop-shadow(0 2px 8px rgba(255,214,10,0.5)); animation: overlay-in 0.5s ease-out; }

  .sd-btn {
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06); color: var(--text);
    border-radius: 999px; font-weight: 700; cursor: pointer;
    font-size: 14px; font-family: inherit; padding: 13px 26px; min-height: 46px;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, filter 0.15s, background 0.15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .sd-btn:hover { background: rgba(255,255,255,0.12); }
  .sd-btn:active { transform: scale(0.96); }
  .sd-btn svg { width: 17px; height: 17px; }
  .sd-btn-primary {
    background: linear-gradient(135deg, #0a84ff 0%, #bf5af2 100%); color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 6px 22px rgba(10,132,255,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
    letter-spacing: 0.04em; font-size: 16px; padding: 15px 40px;
  }
  .sd-btn-primary:hover { filter: brightness(1.12); background: linear-gradient(135deg, #0a84ff 0%, #bf5af2 100%); }
  .sd-btn-ghost { margin-top: 10px; font-size: 13px; padding: 10px 20px; min-height: 40px; opacity: 0.85; }
  .sd-overlay .sd-btn { margin-top: 16px; }

  /* submit + leaderboard */
  .sd-submit-row { display: none; gap: 8px; align-items: center; margin-top: 12px; width: 100%; max-width: 280px; justify-content: center; }
  .sd-submit-row.show { display: flex; }

<script>
(function(){
  // ===================== ICONS =====================
  const ICONS = {
    music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    musicOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="22" y2="22" stroke="#ff453a" stroke-width="2.4"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15" stroke="#ff453a" stroke-width="2.2"/><line x1="16" y1="9" x2="22" y2="15" stroke="#ff453a" stroke-width="2.2"/></svg>',
    bomb: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="15" r="6.6" fill="#14141f" stroke="#fff" stroke-width="1.3"/><path d="M15 9l3-3" stroke="#ffd60a" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="19" cy="5" r="2.2" fill="#ff453a"/></svg>',
    wild: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6l2.5 7L21.5 11l-7 2.4L12 22l-2.5-8.6L2.5 11l7-2.4z"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
    help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9.2a3 3 0 0 1 5.8 1c0 2-3 2.6-3 3.3"/><line x1="12" y1="17.5" x2="12.01" y2="17.5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
    floor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/><line x1="4" y1="21" x2="20" y2="21"/></svg>',
    drop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c4 5 7 8.5 7 12a7 7 0 0 1-14 0c0-3.5 3-7 7-12z"/></svg>'
  };
  function setIcon(el, name) { if (el) el.innerHTML = ICONS[name] || ''; }

  // ===================== AUDIO =====================
  let sfxMuted = localStorage.getItem('sd-sfx-muted') === '1';
  let bgmMuted = localStorage.getItem('sd-bgm-muted') === '1';
  const _legacyMute = localStorage.getItem('sd-muted');
  if (_legacyMute !== null && localStorage.getItem('sd-sfx-muted') === null) {
    sfxMuted = bgmMuted = (_legacyMute === '1');
    localStorage.setItem('sd-sfx-muted', sfxMuted ? '1' : '0');
    localStorage.setItem('sd-bgm-muted', bgmMuted ? '1' : '0');
    localStorage.removeItem('sd-muted');
  }
  let audioUnlocked = false;
  let stingerEl = null;

  const SFX = {
    hit:       { src: 'audio/sfx-hit.mp3',            vol: 0.45, pool: [] },
    wrong:     { src: 'audio/sfx-wrong.mp3',          vol: 0.50, pool: [] },
    mergeS:    { src: 'audio/sfx-correct-small.mp3',  vol: 0.55, pool: [] },
    mergeM:    { src: 'audio/sfx-correct-medium.mp3', vol: 0.60, pool: [] },
    mergeL:    { src: 'audio/sfx-correct-big.mp3',    vol: 0.70, pool: [] },
    bomb:      { src: 'audio/sfx-item-bomb.mp3',      vol: 0.70, pool: [] },
    wild:      { src: 'audio/sfx-item-freeze.mp3',    vol: 0.60, pool: [] },
    heal:      { src: 'audio/sfx-item-heal.mp3',      vol: 0.65, pool: [] },
    milestone: { src: 'audio/sfx-win.mp3',            vol: 0.55, pool: [] },
    warn:      { src: 'audio/sfx-wave-start.mp3',     vol: 0.55, pool: [] },
    rise:      { src: 'audio/sfx-heart-lose.mp3',     vol: 0.55, pool: [] },
    over:      { src: 'audio/sfx-lose.mp3',           vol: 0.65, pool: [] },
    tap:       { src: 'audio/sfx-ui-tap.mp3',         vol: 0.40, pool: [] }
  };
  const SFX_POOL_SIZE = 3;
  for (const def of Object.values(SFX)) {
    for (let i = 0; i < SFX_POOL_SIZE; i++) {
      const a = new Audio(def.src); a.preload = 'auto'; a.volume = def.vol; def.pool.push(a);
    }
  }

  const BGM_TRACKS = ['audio/battle-1.mp3','audio/battle-2.mp3','audio/battle-3.mp3','audio/battle-4.mp3'];
  const BGM_VOL = 0.32;
  const bgmA = new Audio(), bgmB = new Audio();
  bgmA.loop = bgmB.loop = true;
  bgmA.preload = bgmB.preload = 'none';
  let activeBgm = bgmA;
  let bgmFadeRAF = null;

  function sfx(name, opts) {
    if (sfxMuted || !audioUnlocked) return;
    const def = SFX[name]; if (!def) return;
    let a = def.pool.find(x => x.paused || x.ended); if (!a) a = def.pool[0];
    a.playbackRate = (opts && opts.rate) ? opts.rate : 1;
    a.volume = (opts && opts.vol != null) ? opts.vol : def.vol;
    try { a.currentTime = 0; } catch(_) {}
    const p = a.play(); if (p && p.catch) p.catch(() => {});
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    const els = [bgmA, bgmB];
    for (const def of Object.values(SFX)) for (const a of def.pool) els.push(a);
    for (const a of els) {
      try {
        a.muted = true;
        const p = a.play();
        if (p && p.then) { p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); }
        else { a.pause(); a.muted = false; }
      } catch(_) { a.muted = false; }
    }
  }

  function playBgm(url) {
    if (!url) return;
    const cur = activeBgm.src;
    if (cur && cur.indexOf(url) !== -1 && !activeBgm.paused) return;
    const next = (activeBgm === bgmA) ? bgmB : bgmA;
    next.src = url; next.volume = 0;
    if (bgmMuted) { try { next.pause(); } catch(_){} return; }
    const pp = next.play(); if (pp && pp.catch) pp.catch(() => {});
    if (bgmFadeRAF) cancelAnimationFrame(bgmFadeRAF);
    const startTime = performance.now();
    const startVolActive = activeBgm.volume;
    const prev = activeBgm;
    function fade() {
      const t = Math.min(1, (performance.now() - startTime) / 600);
      next.volume = BGM_VOL * t; prev.volume = startVolActive * (1 - t);
      if (t < 1) { bgmFadeRAF = requestAnimationFrame(fade); }
      else { try { prev.pause(); } catch(_){} activeBgm = next; bgmFadeRAF = null; }
    }
    fade();
  }

  function stopBgm() {
    if (bgmFadeRAF) cancelAnimationFrame(bgmFadeRAF);
    const target = activeBgm;
    const startTime = performance.now();
    const startVol = target.volume;
    function fade() {
      const t = Math.min(1, (performance.now() - startTime) / 350);
      target.volume = startVol * (1 - t);
      if (t < 1) bgmFadeRAF = requestAnimationFrame(fade);
      else { try { target.pause(); } catch(_){} bgmFadeRAF = null; }
    }
    fade();
  }

  function playStinger(url, vol) {
    if (sfxMuted || !audioUnlocked) return;
    if (!stingerEl) stingerEl = new Audio();
    try { stingerEl.src = url; stingerEl.volume = vol != null ? vol : 0.5; stingerEl.currentTime = 0; const p = stingerEl.play(); if (p && p.catch) p.catch(() => {}); } catch(_) {}
  }

  function setSfxMuted(m) {
    sfxMuted = m;
    localStorage.setItem('sd-sfx-muted', m ? '1' : '0');
    if (sfxMuted && stingerEl) { try { stingerEl.pause(); } catch(_){} }
    updateAudioIcons();
  }
  function setBgmMuted(m) {
    bgmMuted = m;
    localStorage.setItem('sd-bgm-muted', m ? '1' : '0');
    if (bgmMuted) { bgmA.volume = 0; bgmB.volume = 0; try { bgmA.pause(); bgmB.pause(); } catch(_){} }
    else if (activeBgm.src) { try { const p = activeBgm.play(); if (p && p.catch) p.catch(() => {}); } catch(_){} activeBgm.volume = BGM_VOL; }
    updateAudioIcons();
  }
  function updateAudioIcons() {
    const sfxBtn = document.getElementById('sd-sfx-btn');
    const bgmBtn = document.getElementById('sd-bgm-btn');
    if (sfxBtn) { setIcon(sfxBtn, sfxMuted ? 'soundOff' : 'sound'); sfxBtn.classList.toggle('muted', sfxMuted); }
    if (bgmBtn) { setIcon(bgmBtn, bgmMuted ? 'musicOff' : 'music'); bgmBtn.classList.toggle('muted', bgmMuted); }
  }
  function vibe(pat) { if (sfxMuted) return; if (navigator.vibrate) { try { navigator.vibrate(pat); } catch(_){} } }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (activeBgm && !activeBgm.paused) { activeBgm._wasPlaying = true; try { activeBgm.pause(); } catch(_){} }
    } else {
      if (activeBgm && activeBgm._wasPlaying && !bgmMuted) { try { const p = activeBgm.play(); if (p && p.catch) p.catch(() => {}); } catch(_){} activeBgm._wasPlaying = false; }
    }
  });

  // ===================== HUMOR / QUIPS =====================
  const QUIPS = {
    small: ['nice','pop!','math!','tasty','clean','smooth','neat','mwah','tidy','beep','+vibes','ok ok'],
    mega:  ['MEGA!','spicy','chunky','big brain','show off','stacked','yum','combo meal','oh nice'],
    ultra: ['ULTRA!','INSANE','calm down','are you ok?','unreal','no notes','sheesh','cracked'],
    combo: ['comboooo','chain reaction','domino effect','unstoppable','on a roll','it keeps going','snowball'],
    white: ["CHEF'S KISS",'pure light','rainbow road','blinding!','flawless','galaxy brain','prism perfect'],
    bomb:  ['BOOM','kaboom','demolition','yeet','good oops','fireworks','cleared out'],
    wild:  ['wild!','chaos reigns','anything goes','wildcard','goes with everything'],
    rise:  ["floor's lava!",'incoming!','brace yourself','up we go','rude.','here it comes','the tide rises'],
    near:  ['yikes','getting spicy','sweaty palms','do something!','uh oh','breathe','deep breaths'],
    best:  ['NEW BEST!','personal record!','certified flex','record smashed','big flex','you the goat'],
    over:  ['Gravity remains undefeated.','The floor won this round.','Tiles: many. You: fewer.','skill issue (affectionate).','so close. not really.','GG. blame the tiles.','the tiles send their regards.',"you'll get it next time, champ.",'respawn? oh wait.','the floor is doing great, thanks.'],
    egg:   ['you found me!','sneaky sneaky','secret unlocked','curiosity rewarded'],
    party: ['PARTY!','surprise!',"it's a vibe",'confetti time','weeee'],
    gift:  ['free gift!','lucky you','surprise upgrade','a wild appears']
  };
  function quip(cat) { const a = QUIPS[cat]; return a[(Math.random() * a.length) | 0]; }
  const FUNNY_SCORES = [
    { v: 69, t: 'nice.' }, { v: 420, t: 'nice.' }, { v: 666, t: 'spooky.' },
    { v: 1337, t: 'l33t h4x' }, { v: 2048, t: '2048? wrong game lol' }, { v: 5000, t: "IT'S OVER 5000!!" }
  ];
  let toastTimer = null;
  function toast(text, kind) {
    const el = document.getElementById('sd-toast');
    if (!el) return;
    el.textContent = text;
    el.className = 'sd-toast' + (kind ? ' ' + kind : '');
    void el.offsetWidth; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
  }

  // ===================== PARTICLES =====================
  const POOL_SIZE = 130;
  let particlesContainer = null, particlesPool = [], particlesActive = 0, particlesRAF = null, lastParticleT = 0;
  const SPECTRUM_HEX = ['#ff453a','#ffd60a','#30d158','#64d2ff','#0a84ff','#bf5af2'];

  function initParticles() {
    particlesContainer = document.createElement('div');
    particlesContainer.className = 'sd-particle-layer';
    document.querySelector('.sd-grid-wrap').appendChild(particlesContainer);
    for (let i = 0; i < POOL_SIZE; i++) {
      const el = document.createElement('div'); el.className = 'sd-particle';
      particlesContainer.appendChild(el);
      particlesPool.push({ el, active: false, x:0, y:0, vx:0, vy:0, life:0, ttl:0 });
    }
  }
  function spawnParticle(x, y, vx, vy, color, ttl) {
    const p = particlesPool.find(p => !p.active); if (!p) return;
    p.active = true; particlesActive++;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = 0; p.ttl = ttl;
    p.el.style.background = color; p.el.style.boxShadow = '0 0 8px ' + color; p.el.style.opacity = '1';
    if (!particlesRAF) particlesRAF = requestAnimationFrame(tickParticles);
  }
  function burstAt(r, c, color, count) {
    if (!particlesContainer) initParticles();
    const cell = document.getElementById('sd-cell-' + r + '-' + c); if (!cell) return;
    const wRect = document.querySelector('.sd-grid-wrap').getBoundingClientRect();
    const cr = cell.getBoundingClientRect();
    const cx = cr.left - wRect.left + cr.width / 2;
    const cy = cr.top - wRect.top + cr.height / 2;
    const n = count || 10;
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 70 + Math.random() * 170;
      spawnParticle(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed - 100, color, 0.55 + Math.random() * 0.5);
    }
  }
  function confetti(n) {
    if (!particlesContainer) initParticles();
    const wRect = document.querySelector('.sd-grid-wrap').getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const x = Math.random() * wRect.width;
      spawnParticle(x, -8, (Math.random() - 0.5) * 90, 40 + Math.random() * 90, SPECTRUM_HEX[(Math.random()*SPECTRUM_HEX.length)|0], 1.1 + Math.random() * 0.7);
    }
  }
  function tickParticles(now) {
    const dt = lastParticleT ? Math.min(0.05, (now - lastParticleT) / 1000) : 0.016;
    lastParticleT = now;
    for (const p of particlesPool) {
      if (!p.active) continue;
      p.vy += 540 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
      const lp = p.life / p.ttl;
      if (lp >= 1) { p.active = false; particlesActive--; p.el.style.opacity = '0'; continue; }
      p.el.style.transform = 'translate(' + (p.x - 4) + 'px,' + (p.y - 4) + 'px) scale(' + (1 - lp * 0.6) + ')';
      p.el.style.opacity = String(Math.max(0, 1 - lp));
    }
    if (particlesActive > 0) particlesRAF = requestAnimationFrame(tickParticles);
    else { particlesRAF = null; lastParticleT = 0; }
  }
  function dropTrail(col) {
    const wrap = document.querySelector('.sd-grid-wrap');
    const cell = document.getElementById('sd-cell-0-' + col); if (!cell) return;
    const wRect = wrap.getBoundingClientRect();
    const cr = cell.getBoundingClientRect();
    const x = cr.left - wRect.left + cr.width / 2;
    const trail = document.createElement('div'); trail.className = 'sd-trail';
    trail.style.left = (x - 2.5) + 'px';
    wrap.appendChild(trail);
    setTimeout(() => trail.remove(), 420);
  }

  // ===================== GAME =====================
  const COLS = 6, ROWS = 10;
  const HEX = {1:'#ff453a',2:'#30d158',4:'#0a84ff',3:'#ffd60a',5:'#bf5af2',6:'#64d2ff',7:'#f5f5f7'};
  const DARK_TEXT = new Set([3, 6, 7]);
  const MENACE_INTERVAL = 10;
  const WARN_THRESHOLD = 3;
  const MILESTONES = [64, 128, 256, 512, 1024, 2048];

  let grid, current, queue = [], score = 0, best = 0, combo = 0;
  let dropsToMenace = MENACE_INTERVAL;
  let gameOver = false, busy = false, hoverCol = 2, built = false, started = false;
  let achievements = new Set();
  let googlySession = false;
  let runStartBest = 0, bestToastShown = false, nearDeathCd = 0;

  best = parseInt(localStorage.getItem('sd-best') || '0', 10) || 0;
  function saveBest() { localStorage.setItem('sd-best', String(best)); }

  function currentMenaceInterval() {
    if (score >= 4500) return 5;
    if (score >= 2500) return 6;
    if (score >= 1000) return 8;
    return MENACE_INTERVAL;
  }

  function makeTile() {
    const r = Math.random();
    const wildChance = score >= 4000 ? 0.02 : (score >= 1500 ? 0.03 : 0.04);
    if (r < wildChance) {
      return { wild: true, number: null, color: 7 };
    } else if (r < wildChance + 0.05) {
      const primaries = [1, 2, 4];
      const n = Math.random() < 0.7 ? 2 : 4;
      return { bomb: true, color: primaries[Math.floor(Math.random()*3)], number: n };
    } else {
      const primaries = [1, 2, 4];
      const c = primaries[Math.floor(Math.random() * 3)];
      const rn = Math.random();
      let n;
      if (score >= 4000)      n = rn < 0.45 ? 2 : (rn < 0.78 ? 4 : 8);
      else if (score >= 2000) n = rn < 0.55 ? 2 : (rn < 0.88 ? 4 : 8);
      else if (score >= 800)  n = rn < 0.65 ? 2 : (rn < 0.97 ? 4 : 8);
      else                    n = rn < 0.75 ? 2 : 4;
      const t = { color: c, number: n };
      if (Math.random() < 0.12) t.face = true;
      return t;
    }
  }

  function makeRiseTile() {
    const primaries = [1, 2, 4];
    const blends = [3, 5, 6];
    const useBlend = score >= 3000 && Math.random() < (score >= 5000 ? 0.2 : 0.1);
    const color = useBlend ? blends[Math.floor(Math.random() * 3)] : primaries[Math.floor(Math.random() * 3)];
    const n = (score >= 3000 && Math.random() < 0.25) ? 4 : 2;
    const t = { color, number: n };
    if (Math.random() < 0.1) t.face = true;
    return t;
  }

  function findClusters() {
    const seen = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    const out = [];
    for (let sr = 0; sr < ROWS; sr++) {
      for (let sc = 0; sc < COLS; sc++) {
        if (seen[sr][sc] || !grid[sr][sc]) continue;
        if (grid[sr][sc].wild) continue;
        const num = grid[sr][sc].number;
        const cluster = new Set();
        let colorMask = grid[sr][sc].color;
        cluster.add(sr * COLS + sc);
        function tryAdd(r, c) {
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
          const key = r * COLS + c;
          if (cluster.has(key)) return false;
          if (seen[r][c]) return false;
          const t = grid[r][c];
          if (!t) return false;
          if (t.wild || (t.number === num && (t.color & colorMask) !== 0)) {
            cluster.add(key); colorMask |= t.color; return true;
          }
          return false;
        }
        let changed = true;
        while (changed) {
          changed = false;
          const snapshot = Array.from(cluster);
          for (const key of snapshot) {
            const r = Math.floor(key / COLS), c = key % COLS;
            for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
              if (tryAdd(r + dr, c + dc)) changed = true;
            }
          }
        }
        const tiles = [];
        for (const key of cluster) {
          const r = Math.floor(key / COLS), c = key % COLS;
          seen[r][c] = true; tiles.push([r, c]);
        }
        if (tiles.length >= 2) out.push({ tiles, baseNum: num });
      }
    }
    return out;
  }

  function mergeClusters(clusters) {
    let gained = 0;
    const bombs = [];
    for (const cl of clusters) {
      const tiles = cl.tiles;
      const base = cl.baseNum;
      let mask = 0, hasBomb = false, hasWild = false;
      for (const [r, c] of tiles) {
        const t = grid[r][c]; mask |= t.color;
        if (t.bomb) hasBomb = true;
        if (t.wild) hasWild = true;
      }
      let tgt = tiles[0];
      for (const p of tiles) { if (p[0] > tgt[0] || (p[0] === tgt[0] && p[1] > tgt[1])) tgt = p; }
      for (const [r, c] of tiles) grid[r][c] = null;
      const newVal = base * Math.pow(2, tiles.length - 1);
      const newTile = { color: mask, number: newVal, _new: true };
      if (hasBomb) newTile.bomb = true;
      if (!hasBomb && Math.random() < 0.16) newTile.face = true;
      grid[tgt[0]][tgt[1]] = newTile;
      const colorBits = (mask & 1) + ((mask >> 1) & 1) + ((mask >> 2) & 1);
      const blendMult = colorBits === 3 ? 3 : (colorBits === 2 ? 1.5 : 1);
      const isWhite = blendMult === 3;
      let mergeScore = newVal * tiles.length;
      if (hasWild) mergeScore *= 2;
      mergeScore = Math.round(mergeScore * blendMult);
      gained += mergeScore;
      if (hasBomb) bombs.push(tgt);

      const partColor = HEX[mask] || '#fff';
      const partCount = 6 + Math.min(16, tiles.length * 3) + (isWhite ? 12 : blendMult === 1.5 ? 4 : 0);
      burstAt(tgt[0], tgt[1], partColor, partCount);
      vibe(isWhite ? 45 : 25);

      const rate = Math.min(1.55, 1 + Math.max(0, combo - 1) * 0.13);
      let popupText, popupStyle;
      if (hasWild) {
        sfx('wild'); popupText = quip('wild') + ' +' + mergeScore; popupStyle = 'rainbow';
      } else if (isWhite) {
        sfx('mergeL', { rate }); sfx('milestone', { vol: 0.4 });
        popupText = quip('white') + ' ×3 +' + mergeScore; popupStyle = 'rainbow';
      } else if (tiles.length >= 4) {
        sfx('mergeL', { rate }); popupText = quip('ultra') + ' +' + mergeScore; popupStyle = 'big';
      } else if (tiles.length >= 3) {
        sfx('mergeM', { rate }); popupText = quip('mega') + ' +' + mergeScore + (blendMult === 1.5 ? ' ×1.5' : ''); popupStyle = 'big';
      } else {
        sfx(blendMult === 1.5 ? 'mergeM' : 'mergeS', { rate });
        popupText = (Math.random() < 0.3 ? quip('small') + ' ' : '') + '+' + mergeScore + (blendMult === 1.5 ? ' ×1.5' : '');
        popupStyle = null;
      }
      showPopup(popupText, tgt, popupStyle);

      if (mask === 7 && !achievements.has('white')) {
        achievements.add('white');
        setTimeout(() => showPopup('FIRST WHITE!', null, 'rainbow'), 200);
        flashScreen(); sfx('heal'); playStinger('audio/bgm-win.mp3', 0.55);
      }
      for (const mile of MILESTONES) {
        if (newVal >= mile && !achievements.has('m' + mile)) {
          achievements.add('m' + mile);
          setTimeout(() => showPopup(mile + '!', null, 'big'), 400);
          sfx('milestone');
          if (mile >= 512) playStinger('audio/bgm-win.mp3', 0.45);
        }
      }
    }
    for (const [r, c] of bombs) {
      let bombScore = 0, cleared = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if (grid[nr][nc]) {
          bombScore += grid[nr][nc].number * 2;
          burstAt(nr, nc, HEX[grid[nr][nc].color] || '#fff', 8);
          grid[nr][nc] = null; cleared++;
        }
      }
      if (grid[r][c]) grid[r][c].bomb = false;
      gained += bombScore;
      if (cleared > 0) { sfx('bomb'); vibe([30, 20, 30]); shakeBoard(); showPopup(quip('bomb') + ' +' + bombScore, [r, c], 'warning'); }
    }
    return gained;
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let w = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c]) {
          if (r !== w) { grid[w][c] = grid[r][c]; grid[r][c] = null; }
          w--;
        }
      }
    }
  }

  function init() {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    current = makeTile();
    queue = [makeTile(), makeTile(), makeTile()];
    score = 0; combo = 0;
    dropsToMenace = currentMenaceInterval();
    achievements = new Set();
    gameOver = false; busy = false;
    runStartBest = best; bestToastShown = false; nearDeathCd = 0;
    document.getElementById('sd-overlay').classList.remove('show');
    document.getElementById('sd-grid').classList.remove('warning');
    hideCombo();
    if (stingerEl) try { stingerEl.pause(); } catch(_){}
    render();
  }

  function beginGame() {
    unlockAudio(); sfx('tap');
    document.getElementById('sd-start').classList.remove('show');
    document.getElementById('sd-help').classList.remove('show');
    started = true;
    init();
    playBgm(BGM_TRACKS[Math.floor(Math.random() * BGM_TRACKS.length)]);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function resolveCascades() {
    let totalGain = 0;
    while (true) {
      const clusters = findClusters();
      if (clusters.length === 0) break;
      combo++;
      if (combo >= 2) {
        showCombo(combo);
        if (combo >= 3 && Math.random() < 0.5) toast(quip('combo'), combo >= 4 ? 'rainbow' : null);
      }
      const g = mergeClusters(clusters);
      totalGain += g * combo;
      render();
      await sleep(280);
      applyGravity();
      render();
      await sleep(170);
    }
    return totalGain;
  }

  async function drop(col) {
    if (!started || gameOver || busy) return;
    let landed = -1;
    for (let r = ROWS - 1; r >= 0; r--) { if (!grid[r][col]) { landed = r; break; } }
    if (landed < 0) { shakeColumn(col); sfx('wrong'); vibe(40); return; }

    busy = true;
    dropTrail(col); sfx('hit'); vibe(10);
    grid[landed][col] = Object.assign({}, current, { _new: true });
    combo = 0;
    render();
    await sleep(130);

    let totalGain = await resolveCascades();
    score += totalGain;
    if (score > best) { best = score; saveBest(); }
    updateStats();
    if (totalGain > 0) pulseScore();
    checkFunnyScores();
    if (!bestToastShown && runStartBest > 0 && score > runStartBest) { bestToastShown = true; toast(quip('best'), 'best'); }

    if (grid[0].some(t => t !== null)) return endGame();

    current = queue.shift();
    queue.push(makeTile());
    combo = 0;
    dropsToMenace--;

    if (dropsToMenace <= 0) {
      dropsToMenace = currentMenaceInterval();
      await triggerMenace();
      if (gameOver) return;
    }

    maybeNearDeath();
    maybeSurprise();

    busy = false;
    render();
  }

  function checkFunnyScores() {
    for (const f of FUNNY_SCORES) {
      if (score >= f.v && !achievements.has('fn' + f.v)) {
        achievements.add('fn' + f.v);
        toast(f.t, 'rainbow');
        break;
      }
    }
  }

  function maybeNearDeath() {
    if (nearDeathCd > 0) { nearDeathCd--; return; }
    let danger = 0;
    for (let c = 0; c < COLS; c++) if (grid[0][c] || grid[1][c]) danger++;
    if (danger >= 3 && Math.random() < 0.35) { toast(quip('near'), 'warn'); nearDeathCd = 4; }
  }

  function maybeSurprise() {
    if (Math.random() >= 0.04) return;
    const roll = Math.random();
    if (roll < 0.4) {
      confetti(60); toast(quip('party'), 'rainbow'); vibe([10, 40, 10]);
    } else if (roll < 0.72) {
      const g = document.getElementById('sd-grid');
      g.classList.remove('wiggle'); void g.offsetWidth; g.classList.add('wiggle');
      setTimeout(() => g.classList.remove('wiggle'), 700);
      toast('wiggle wiggle', null);
    } else {
      queue[0] = { wild: true, number: null, color: 7 };
      toast(quip('gift'), 'rainbow');
      sfx('wild');
    }
  }

  async function triggerMenace() {
    if (grid[0].some(t => t !== null)) return endGame();
    shakeBoard(); sfx('warn'); vibe([20, 30, 20]);
    toast(Math.random() < 0.5 ? 'FLOOR RISING!' : quip('rise'), 'warn');
    await sleep(450);
    for (let r = 0; r < ROWS - 1; r++) grid[r] = grid[r + 1];
    const newRow = [];
    for (let c = 0; c < COLS; c++) {
      if (Math.random() < 0.5) { const t = makeRiseTile(); t._new = true; newRow.push(t); } else newRow.push(null);
    }
    grid[ROWS-1] = newRow;
    sfx('rise'); vibe([15, 30, 15]);
    render();
    await sleep(380);
    combo = 0;
    const gain = await resolveCascades();
    score += gain;
    if (score > best) { best = score; saveBest(); }
    updateStats();
    if (grid[0].some(t => t !== null)) return endGame();
  }

  // ===================== LEADERBOARD =====================
  const LB_API = '/api/scores';
  let leaderboard = [];
  let lastSubmittedScore = -1;

  async function loadLeaderboard() {
    try {
      const r = await fetch(LB_API, { cache: 'no-store' });
      if (!r.ok) throw new Error('GET ' + r.status);
      leaderboard = await r.json();
    } catch (e) { leaderboard = []; throw e; }
  }
  function qualifies(s) {
    if (s < 1) return false;
    if (leaderboard.length < 10) return true;
    return s > leaderboard[leaderboard.length - 1].score;
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderLeaderboard(highlightName) {
    const el = document.getElementById('sd-leaderboard');
    let html = '<p class="sd-leaderboard-title">Top 10 — Global</p>';
    if (!leaderboard.length) {
      html += '<div class="sd-leaderboard-empty">No scores yet — be first!</div>';
    } else {
      html += leaderboard.map((s, i) => {
        const isYou = highlightName && s.name === highlightName && s.score === lastSubmittedScore;
        return '<div class="sd-leaderboard-row' + (isYou ? ' you' : '') + '">' +
          '<span class="sd-leaderboard-rank">' + (i + 1) + '</span>' +
          '<span class="sd-leaderboard-name">' + escapeHtml(s.name) + '</span>' +
          '<span class="sd-leaderboard-score">' + s.score.toLocaleString() + '</span>' +
          '</div>';
      }).join('');
    }
    el.innerHTML = html;
  }
  async function submitNameClicked() {
    const input = document.getElementById('sd-name-input');
    const btn = document.getElementById('sd-submit-btn');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch(LB_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score }) });
      if (!r.ok) throw new Error('POST ' + r.status);
      leaderboard = await r.json();
      lastSubmittedScore = score;
      localStorage.setItem('sd-last-name', name);
      document.getElementById('sd-submit-row').classList.remove('show');
      btn.textContent = '✓';
      renderLeaderboard(name);
      sfx('milestone');
    } catch (e) { btn.disabled = false; btn.textContent = 'Retry'; }
  }

  function endGame() {
    gameOver = true; busy = false;
    saveBest();
    hideCombo();
    document.getElementById('sd-final').textContent = score.toLocaleString();
    document.getElementById('sd-final-best').textContent = best.toLocaleString();
    document.getElementById('sd-overlay-meta').textContent = quip('over');
    const submitRow = document.getElementById('sd-submit-row');
    const submitBtn = document.getElementById('sd-submit-btn');
    submitRow.classList.remove('show');
    submitBtn.disabled = false; submitBtn.textContent = 'Submit';
    document.getElementById('sd-leaderboard').innerHTML = '<p class="sd-leaderboard-title">Top 10 — Global</p><div class="sd-leaderboard-empty">Loading…</div>';
    const nameInput = document.getElementById('sd-name-input');
    const savedName = localStorage.getItem('sd-last-name');
    if (savedName) nameInput.value = savedName;
    document.getElementById('sd-overlay').classList.add('show');
    sfx('over'); vibe([40, 30, 40, 30, 80]);
    setTimeout(() => playBgm('audio/bgm-lose.mp3'), 250);
    loadLeaderboard().then(() => {
      renderLeaderboard();
      if (qualifies(score)) submitRow.classList.add('show');
    }).catch(() => {
      document.getElementById('sd-leaderboard').innerHTML = '<p class="sd-leaderboard-title">Top 10 — Global</p><div class="sd-leaderboard-empty">Leaderboard unavailable</div>';
    });
  }

  function shakeBoard() {
    const w = document.getElementById('sd-grid');
    w.classList.remove('shaking'); void w.offsetWidth; w.classList.add('shaking');
    setTimeout(() => w.classList.remove('shaking'), 500);
  }
  function shakeColumn(col) {
    for (let r = 0; r < ROWS; r++) {
      const cell = document.getElementById('sd-cell-' + r + '-' + col); if (!cell) continue;
      cell.classList.remove('sd-flash'); void cell.offsetWidth; cell.classList.add('sd-flash');
    }
  }
  function flashScreen() {
    document.body.classList.remove('flashing'); void document.body.offsetWidth; document.body.classList.add('flashing');
    setTimeout(() => document.body.classList.remove('flashing'), 700);
  }
  function pulseScore() {
    const el = document.getElementById('sd-score');
    el.classList.remove('sd-pulse'); void el.offsetWidth; el.classList.add('sd-pulse');
  }

  let comboTimer = null;
  function showCombo(n) {
    const m = document.getElementById('sd-combo-meter');
    m.querySelector('.sd-combo-x').textContent = '×' + n;
    m.querySelector('.sd-combo-fill').style.width = Math.min(100, n * 20) + '%';
    m.classList.remove('lv2','lv3','lv4');
    m.classList.add(n >= 4 ? 'lv4' : (n >= 3 ? 'lv3' : 'lv2'));
    m.classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(hideCombo, 1100);
  }
  function hideCombo() { const m = document.getElementById('sd-combo-meter'); if (m) m.classList.remove('show'); }

  function showPopup(text, target, style) {
    const popup = document.createElement('div');
    popup.className = 'sd-popup';
    if (style) popup.classList.add(style);
    popup.textContent = text;
    const wrap = document.querySelector('.sd-grid-wrap');
    if (target && Array.isArray(target)) {
      const [r, c] = target;
      const rect = wrap.getBoundingClientRect();
      popup.style.left = (rect.width / COLS * (c + 0.5)) + 'px';
      popup.style.top = (rect.height / ROWS * (r + 0.5)) + 'px';
    } else { popup.style.left = '50%'; popup.style.top = '42%'; }
    wrap.appendChild(popup);
    setTimeout(() => popup.remove(), 1400);
  }

  function buildGrid() {
    const g = document.getElementById('sd-grid'); g.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'sd-cell'; cell.id = 'sd-cell-' + r + '-' + c;
        g.appendChild(cell);
      }
    }
    const p = document.getElementById('sd-preview'); p.innerHTML = '';
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'sd-preview-cell'; cell.id = 'sd-preview-' + c;
      p.appendChild(cell);
    }
    built = true;
  }

  function applyTileMini(el, t, slot) {
    el.className = 'sd-tile-mini' + (slot ? ' q' + slot : '');
    el.style.backgroundColor = ''; el.style.color = ''; el.innerHTML = '';
    if (!t) { el.classList.add('empty'); return; }
    if (t.wild) {
      el.classList.add('wild');
      el.innerHTML = '<span class="sd-wild-mark">' + ICONS.wild + '</span>';
    } else {
      el.style.backgroundColor = HEX[t.color];
      el.style.color = DARK_TEXT.has(t.color) ? '#1c1c1e' : '#fff';
      el.innerHTML = '<span class="sd-mini-num">' + t.number + '</span>' + (t.bomb ? '<span class="sd-bomb-badge">' + ICONS.bomb + '</span>' : '');
      if (t.bomb) el.classList.add('bomb');
    }
  }

  function renderPreview() {
    for (let c = 0; c < COLS; c++) {
      const cell = document.getElementById('sd-preview-' + c);
      if (!cell) continue;
      if (c === hoverCol && started && !gameOver && !busy) {
        cell.classList.add('active');
        if (current.wild) {
          cell.style.background = 'linear-gradient(45deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a)';
          cell.style.backgroundSize = '400% 400%';
          cell.style.animation = 'rainbow 2.5s linear infinite, bob 1.4s ease-in-out infinite';
          cell.style.color = '#fff';
          cell.innerHTML = '<span class="sd-wild-mark">' + ICONS.wild + '</span>';
          cell.style.boxShadow = '0 4px 14px rgba(255,255,255,0.4)';
        } else {
          cell.style.background = HEX[current.color];
          cell.style.color = DARK_TEXT.has(current.color) ? '#1c1c1e' : '#fff';
          cell.style.boxShadow = '0 4px 14px ' + HEX[current.color] + '66, inset 0 1px 0 rgba(255,255,255,0.3)';
          cell.textContent = current.number;
          cell.style.animation = '';
          if (current.bomb) cell.style.boxShadow = '0 0 0 2px #ff453a, 0 4px 14px rgba(255,69,58,0.6)';
        }
      } else {
        cell.classList.remove('active');
        cell.style.background = ''; cell.style.boxShadow = ''; cell.style.animation = ''; cell.innerHTML = '';
      }
    }
  }

  function fontSizeFor(n) {
    const len = String(n).length;
    if (len >= 5) return '0.6em';
    if (len === 4) return '0.72em';
    if (len === 3) return '0.85em';
    return '1em';
  }

  function updateRiseRing() {
    const ring = document.getElementById('sd-rise');
    const interval = currentMenaceInterval();
    const pct = Math.max(0, Math.min(1, dropsToMenace / interval));
    ring.style.setProperty('--pct', (pct * 100) + '%');
    ring.querySelector('.sd-rise-num').textContent = dropsToMenace;
    ring.classList.toggle('warn', dropsToMenace <= WARN_THRESHOLD);
  }
  function renderQueue() {
    for (let i = 0; i < 3; i++) applyTileMini(document.getElementById('sd-queue-' + i), queue[i], i);
  }
  function updateStats() {
    document.getElementById('sd-score').textContent = score.toLocaleString();
    const b1 = document.getElementById('sd-best'); if (b1) b1.textContent = best.toLocaleString();
    updateRiseRing();
    document.getElementById('sd-grid').classList.toggle('warning', dropsToMenace <= 1);
    renderQueue();
  }

  function render() {
    if (!built) buildGrid();
    updateStats();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.getElementById('sd-cell-' + r + '-' + c);
        const t = grid[r][c];
        const face = t && !t.wild && !t.bomb && (t.face || googlySession);
        const sig = t ? (t.color + '-' + t.number + '-' + (t.wild?1:0) + '-' + (t.bomb?1:0) + '-' + (face?1:0)) : '';
        const isNew = t && t._new;
        if (cell.dataset.sig === sig && !isNew) continue;
        cell.dataset.sig = sig;
        cell.innerHTML = '';
        if (t) {
          const tile = document.createElement('div');
          tile.className = 'sd-tile';
          if (isNew) tile.classList.add('new');
          if (t.wild) {
            tile.classList.add('wild');
            tile.innerHTML = '<span class="sd-wild-mark">' + ICONS.wild + '</span>';
          } else {
            tile.style.backgroundColor = HEX[t.color];
            tile.style.color = DARK_TEXT.has(t.color) ? '#1c1c1e' : '#fff';
            tile.innerHTML = '<span class="sd-num" style="font-size:' + fontSizeFor(t.number) + '">' + t.number + '</span>'
              + (t.bomb ? '<span class="sd-bomb-badge">' + ICONS.bomb + '</span>' : '')
              + (face ? '<span class="sd-face"><i></i><i></i></span>' : '');
            if (t.bomb) tile.classList.add('bomb');
          }
          cell.appendChild(tile);
          if (isNew) delete t._new;
        }
      }
    }
    renderPreview();
  }

  // ===================== HELP =====================
  function chip(color) { return '<span class="sd-chip" style="background:' + HEX[color] + '"></span>'; }
  function buildHelp() {
    const body = document.getElementById('sd-help-body');
    body.innerHTML =
      '<div class="sd-help-rule"><span class="sd-help-ic">' + ICONS.drop + '</span><div><b>Tap a column</b> to drop the tile. Drag to aim, release to drop.</div></div>' +
      '<div class="sd-help-rule"><span class="sd-help-ic">' + chipPair() + '</span><div><b>Merge</b> tiles that share a <b>number</b> AND a <b>color</b>. Colors blend when they merge:</div></div>' +
      '<div class="sd-mix">' +
        mixRow(1,2,3,'×1.5') + mixRow(1,4,5,'×1.5') + mixRow(2,4,6,'×1.5') +
        '<div class="sd-mix-row">' + chip(1) + chip(2) + chip(4) + '<span class="sd-mix-eq">=</span>' + chip(7) + '<span class="sd-mix-mult">×3 WHITE</span></div>' +
      '</div>' +
      '<div class="sd-help-rule"><span class="sd-help-ic">' + ICONS.wild + '</span><div><b>Wild</b> matches any number and any color — your bridge piece.</div></div>' +
      '<div class="sd-help-rule"><span class="sd-help-ic">' + ICONS.bomb + '</span><div><b>Bomb</b> blows up a 3×3 area when it merges.</div></div>' +
      '<div class="sd-help-rule"><span class="sd-help-ic">' + ICONS.floor + '</span><div>The <b>floor rises</b> every few drops — and faster as you score. Clear space fast!</div></div>' +
      '<div class="sd-help-rule"><span class="sd-help-ic">' + ICONS.help + '</span><div>Expect the unexpected. Some tiles are watching you — yes, really.</div></div>';
  }
  function chipPair() { return chip(1) + chip(1); }
  function mixRow(a, b, res, mult) {
    return '<div class="sd-mix-row">' + chip(a) + chip(b) + '<span class="sd-mix-eq">=</span>' + chip(res) + '<span class="sd-mix-mult">' + mult + '</span></div>';
  }
  function showHelp() { buildHelp(); document.getElementById('sd-help').classList.add('show'); }
  function hideHelp() { document.getElementById('sd-help').classList.remove('show'); }
  function showStart() {
    document.getElementById('sd-start-best').textContent = best.toLocaleString();
    document.getElementById('sd-start').classList.add('show');
  }

  // ===================== INPUT =====================
  function colFromX(x) {
    const grid = document.getElementById('sd-grid');
    const rect = grid.getBoundingClientRect();
    let best = 0, bestDist = Infinity;
    for (let c = 0; c < COLS; c++) {
      const cell = document.getElementById('sd-cell-' + (ROWS - 1) + '-' + c);
      if (!cell) { const colW = rect.width / COLS; return Math.max(0, Math.min(COLS - 1, Math.floor((x - rect.left) / colW))); }
      const cr = cell.getBoundingClientRect();
      const d = Math.abs(x - (cr.left + cr.width / 2));
      if (d < bestDist) { bestDist = d; best = c; }
    }
    return best;
  }

  let pointerStart = null;
  function setupInput() {
    const playArea = document.querySelector('.sd-play-area');
    function blocked(e) { return !started || gameOver || (e.target && e.target.closest && e.target.closest('.sd-overlay')); }

    playArea.addEventListener('pointerdown', (e) => {
      if (blocked(e)) return;
      unlockAudio();
      pointerStart = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      hoverCol = colFromX(e.clientX); renderPreview();
      try { playArea.setPointerCapture(e.pointerId); } catch(_){}
      e.preventDefault();
    });
    playArea.addEventListener('pointermove', (e) => {
      if (blocked(e) || !pointerStart) return;
      const newCol = colFromX(e.clientX);
      if (newCol !== hoverCol) { hoverCol = newCol; renderPreview(); }
    });
    playArea.addEventListener('pointerup', (e) => {
      if (!pointerStart) return;
      pointerStart = null;
      try { playArea.releasePointerCapture(e.pointerId); } catch(_){}
      hoverCol = colFromX(e.clientX);
      drop(hoverCol);
    });
    playArea.addEventListener('pointercancel', () => { pointerStart = null; });

    document.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'm' || e.key === 'M') {
        unlockAudio();
        const newState = !(sfxMuted && bgmMuted);
        setSfxMuted(newState); setBgmMuted(newState);
        if (!newState) sfx('tap');
        e.preventDefault(); return;
      }
      const startVisible = document.getElementById('sd-start').classList.contains('show');
      const helpVisible = document.getElementById('sd-help').classList.contains('show');
      if (helpVisible) { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { hideHelp(); e.preventDefault(); } return; }
      if (startVisible) { if (e.key === ' ' || e.key === 'Enter') { beginGame(); e.preventDefault(); } return; }
      if (gameOver) {
        if (e.key === 'r' || e.key === 'R' || e.key === ' ' || e.key === 'Enter') { beginGame(); e.preventDefault(); }
        return;
      }
      if (e.key === 'ArrowLeft') { hoverCol = (hoverCol <= 0) ? COLS - 1 : hoverCol - 1; renderPreview(); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { hoverCol = (hoverCol >= COLS - 1) ? 0 : hoverCol + 1; renderPreview(); e.preventDefault(); }
      else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') { unlockAudio(); drop(hoverCol); e.preventDefault(); }
      else if (e.key === 'r' || e.key === 'R') { beginGame(); }
    });

    document.getElementById('sd-restart').addEventListener('click', () => { beginGame(); });
    document.getElementById('sd-overlay-restart').addEventListener('click', () => { beginGame(); });
    document.getElementById('sd-start-play').addEventListener('click', () => { beginGame(); });
    document.getElementById('sd-start-help').addEventListener('click', () => { unlockAudio(); sfx('tap'); showHelp(); });
    document.getElementById('sd-help-ok').addEventListener('click', () => { sfx('tap'); hideHelp(); });
    document.getElementById('sd-help-close').addEventListener('click', () => { sfx('tap'); hideHelp(); });

    document.getElementById('sd-sfx-btn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); setSfxMuted(!sfxMuted); if (!sfxMuted) sfx('tap'); });
    document.getElementById('sd-bgm-btn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); setBgmMuted(!bgmMuted); if (!sfxMuted) sfx('tap'); });

    document.getElementById('sd-submit-btn').addEventListener('click', submitNameClicked);
    document.getElementById('sd-name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitNameClicked(); } });

    // Easter egg: tap the start logo 5x quickly
    let logoTaps = 0, logoTapTimer = null;
    document.getElementById('sd-start-logo').addEventListener('click', () => {
      logoTaps++;
      clearTimeout(logoTapTimer);
      logoTapTimer = setTimeout(() => { logoTaps = 0; }, 1600);
      if (logoTaps >= 5) {
        logoTaps = 0;
        googlySession = true;
        unlockAudio(); sfx('heal');
        confetti(70);
        document.querySelector('.sd-start-tag').textContent = quip('egg') + ' googly mode ON';
      }
    });

    setIcon(document.getElementById('sd-help-close'), 'close');
    updateAudioIcons();
  }

  setupInput();
  init();
  showStart();
})();
</script>
</body>
</html>
