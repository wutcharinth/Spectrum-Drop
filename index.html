<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a14">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<title>Spectrum Drop</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a14 70%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #f5f5f7;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex; justify-content: center; align-items: flex-start;
    padding: calc(20px + env(safe-area-inset-top)) 12px env(safe-area-inset-bottom);
  }
  body.flashing::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 200;
    animation: screen-flash 0.6s ease-out;
  }
  @keyframes screen-flash {
    0% { background: rgba(255,255,255,0); }
    25% { background: rgba(255,255,255,0.55); }
    100% { background: rgba(255,255,255,0); }
  }
  .sd-wrap { max-width: 460px; width: 100%; position: relative; }
  .sd-top-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 2px 10px; margin-bottom: 2px;
  }
  .sd-icon-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%; color: #f5f5f7;
    font-size: 16px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, background 0.12s, opacity 0.15s;
    line-height: 1; position: relative;
  }
  .sd-icon-btn:hover { background: rgba(255,255,255,0.12); }
  .sd-icon-btn:active { transform: scale(0.88); }
  .sd-icon-btn.off { opacity: 0.4; }
  .sd-icon-btn.off::after {
    content: ''; position: absolute;
    left: 18%; right: 18%; top: 48%; height: 2px;
    background: #ff453a;
    transform: rotate(-30deg);
    border-radius: 2px;
    pointer-events: none;
  }
  .sd-score {
    flex: 1; text-align: center;
    font-size: clamp(22px, 6vw, 30px); font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    min-width: 0;
    line-height: 1.1;
  }
  .sd-rise-chip {
    min-width: 36px; height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    font-weight: 700; font-size: 14px;
    padding: 0 12px;
    font-variant-numeric: tabular-nums;
    transition: color 0.2s, background 0.2s, border-color 0.2s;
  }
  .sd-rise-chip.rise-warn {
    color: #ff453a;
    background: rgba(255,69,58,0.15);
    border-color: rgba(255,69,58,0.45);
    animation: rise-pulse 0.7s ease-in-out infinite;
  }
  @keyframes rise-pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 transparent; }
    50% { transform: scale(1.08); box-shadow: 0 0 14px rgba(255,69,58,0.55); }
  }
  .sd-next-chip {
    width: 36px; height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .sd-next-chip .sd-tile-mini { width: 34px; height: 34px; font-size: 13px; }
  .sd-pulse { animation: score-pulse 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes score-pulse {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(1.18); filter: brightness(1.6) drop-shadow(0 0 12px rgba(255,214,10,0.7)); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .sd-tile-mini {
    width: 30px; height: 30px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    position: relative;
  }
  .sd-tile-mini.wild {
    background: linear-gradient(45deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a) !important;
    background-size: 400% 400% !important;
    animation: rainbow 2.5s linear infinite;
    color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .sd-tile-mini.bomb {
    box-shadow: 0 0 0 2px #ff453a, 0 0 10px rgba(255,69,58,0.7), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .sd-tile-mini.bomb::after {
    content: '💥'; position: absolute; top: -6px; right: -6px; font-size: 11px;
  }
  .sd-play-area {
    touch-action: none;
    -webkit-touch-callout: none;
  }
  .sd-preview-row {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    margin-bottom: 4px; padding: 0 6px; min-height: 42px;
  }
  .sd-preview-cell {
    aspect-ratio: 1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(12px, 3vw, 15px);
    transition: opacity 0.12s; opacity: 0; cursor: pointer; position: relative;
  }
  .sd-preview-cell.active { opacity: 0.95; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob {
    0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); }
  }
  .sd-grid-wrap { position: relative; }
  .sd-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    padding: 6px; background: rgba(0,0,0,0.4);
    border-radius: 14px; border: 1px solid rgba(255,255,255,0.06);
    position: relative; transition: box-shadow 0.3s;
  }
  .sd-grid.warning {
    animation: grid-warn 0.8s ease-in-out infinite;
  }
  @keyframes grid-warn {
    0%,100% { box-shadow: 0 0 0 2px #ff453a, 0 0 20px rgba(255,69,58,0.4); }
    50% { box-shadow: 0 0 0 3px #ff453a, 0 0 40px rgba(255,69,58,0.75); }
  }
  .sd-grid.shaking { animation: shake 0.45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    10%,30%,50%,70%,90% { transform: translateX(-5px); }
    20%,40%,60%,80% { transform: translateX(5px); }
  }
  .sd-cell {
    aspect-ratio: 1; background: rgba(255,255,255,0.025); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: background 0.15s;
  }
  .sd-cell:hover { background: rgba(255,255,255,0.06); }
  .sd-tile {
    width: 92%; height: 92%; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(11px, 3vw, 17px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.3),
                inset 0 -1px 0 rgba(0,0,0,0.15);
    line-height: 1; position: relative;
  }
  .sd-tile.new { animation: pop 0.32s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .sd-tile.wild {
    background: linear-gradient(45deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a) !important;
    background-size: 400% 400% !important;
    animation: rainbow 2.5s linear infinite;
    color: #fff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.5); font-size: 1.5em;
  }
  .sd-tile.wild.new { animation: rainbow 2.5s linear infinite, pop 0.32s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }
  .sd-tile.bomb {
    box-shadow: 0 0 0 2px #ff453a, 0 0 14px rgba(255,69,58,0.6),
                inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .sd-tile.bomb::before {
    content: '💥'; position: absolute; top: -6px; right: -6px; font-size: 12px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
  }
  .sd-particle-layer {
    position: absolute; inset: 0; pointer-events: none;
    overflow: hidden; border-radius: 14px; z-index: 5;
  }
  .sd-particle {
    position: absolute; width: 8px; height: 8px;
    border-radius: 2px; opacity: 0;
    pointer-events: none; will-change: transform, opacity;
    top: 0; left: 0;
  }
  .sd-trail {
    position: absolute; top: 6px; width: 5px;
    height: calc(100% - 12px);
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.55) 50%, transparent);
    border-radius: 4px; pointer-events: none; z-index: 4;
    animation: trail-fade 0.42s ease-out forwards;
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
  }
  @keyframes trail-fade {
    0% { opacity: 0; transform: translateY(-30%) scaleY(0.4); }
    25% { opacity: 1; transform: translateY(0) scaleY(1); }
    100% { opacity: 0; transform: translateY(20%) scaleY(0.7); }
  }
  .sd-logo-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    background: transparent; border: none; padding: 0; margin: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), filter 0.15s;
  }
  .sd-logo-btn svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45));
  }
  .sd-logo-btn:hover { filter: brightness(1.15) drop-shadow(0 0 8px rgba(255,255,255,0.25)); }
  .sd-logo-btn:active { transform: scale(0.85) rotate(-20deg); }
  .sd-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 14px; z-index: 10; gap: 6px;
    padding: 24px 20px;
  }
  .sd-overlay-logo {
    width: 64px; height: 64px;
    margin-bottom: 8px;
    animation: overlay-in 0.55s cubic-bezier(0.34,1.56,0.64,1);
    filter: drop-shadow(0 4px 16px rgba(255,255,255,0.18));
  }
  .sd-overlay h2 {
    font-size: 28px; margin: 0;
    background: linear-gradient(90deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 0.06em; font-weight: 800;
    animation: overlay-in 0.55s ease-out;
  }
  @keyframes overlay-in {
    0% { opacity: 0; transform: translateY(-14px) scale(0.85); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .sd-overlay-meta { font-size: 12px; opacity: 0.55; letter-spacing: 0.1em; text-transform: uppercase; margin: 4px 0 0; }
  .sd-overlay-score {
    font-size: 38px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: #fff; margin: 2px 0 0;
    text-shadow: 0 2px 12px rgba(255,255,255,0.15);
  }
  .sd-overlay-best { font-size: 12px; opacity: 0.55; margin: 4px 0 0; }
  .sd-btn {
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06); color: #f5f5f7;
    border-radius: 999px; font-weight: 700; cursor: pointer;
    font-size: 14px; font-family: inherit;
    padding: 13px 28px; min-height: 46px;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, filter 0.15s, background 0.15s;
  }
  .sd-btn:hover { background: rgba(255,255,255,0.12); }
  .sd-btn:active { transform: scale(0.96); }
  .sd-overlay .sd-btn {
    margin-top: 18px;
    padding: 14px 36px;
    font-size: 15px;
    background: linear-gradient(135deg, #0a84ff 0%, #bf5af2 100%);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    box-shadow: 0 6px 22px rgba(10,132,255,0.45),
                inset 0 1px 0 rgba(255,255,255,0.3);
    letter-spacing: 0.04em;
  }
  .sd-overlay .sd-btn:hover { filter: brightness(1.12); background: linear-gradient(135deg, #0a84ff 0%, #bf5af2 100%); }
  .sd-submit-row {
    display: none; gap: 8px; align-items: center;
    margin-top: 12px; width: 100%; max-width: 280px;
    justify-content: center;
  }
  .sd-submit-row.show { display: flex; }
  .sd-name-input {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 14px; font-weight: 700;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    flex: 1; min-width: 0;
    outline: none;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .sd-name-input:focus {
    border-color: rgba(10,132,255,0.7);
    background: rgba(255,255,255,0.15);
  }
  .sd-name-input::placeholder { color: rgba(255,255,255,0.35); letter-spacing: 0.1em; }
  .sd-submit-btn {
    flex-shrink: 0;
    padding: 11px 18px; min-height: 0; font-size: 13px;
    background: linear-gradient(135deg, #30d158 0%, #0a84ff 100%);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 999px;
    cursor: pointer; font-weight: 700; font-family: inherit;
    letter-spacing: 0.04em;
    transition: transform 0.08s, filter 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .sd-submit-btn:hover { filter: brightness(1.12); }
  .sd-submit-btn:active { transform: scale(0.96); }
  .sd-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .sd-leaderboard {
    width: 100%; max-width: 280px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-variant-numeric: tabular-nums;
    max-height: 180px;
    overflow-y: auto;
  }
  .sd-leaderboard-title {
    font-size: 10px; opacity: 0.5;
    text-transform: uppercase; letter-spacing: 0.16em;
    text-align: center; margin: 0 0 6px; font-weight: 700;
  }
  .sd-leaderboard-row {
    display: flex; gap: 10px;
    padding: 4px 8px;
    align-items: center;
    font-size: 12px;
    border-radius: 6px;
  }
  .sd-leaderboard-row.you {
    background: rgba(10,132,255,0.22);
    box-shadow: inset 0 0 0 1px rgba(10,132,255,0.45);
  }
  .sd-leaderboard-rank {
    width: 18px; opacity: 0.5; font-weight: 700; text-align: right;
  }
  .sd-leaderboard-row.you .sd-leaderboard-rank { opacity: 1; color: #64d2ff; }
  .sd-leaderboard-name {
    flex: 1; opacity: 0.85; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .sd-leaderboard-row.you .sd-leaderboard-name { opacity: 1; }
  .sd-leaderboard-score { font-weight: 700; }
  .sd-leaderboard-empty {
    text-align: center; opacity: 0.4;
    font-size: 12px; padding: 12px 0;
  }
  .sd-flash { animation: cell-flash 0.4s ease-out; }
  @keyframes cell-flash {
    0% { background: rgba(255,80,80,0.25); }
    100% { background: rgba(255,255,255,0.025); }
  }
  .sd-popup {
    position: absolute; pointer-events: none;
    font-weight: 900; font-size: 22px; color: #fff;
    text-shadow: 0 0 14px rgba(255,255,255,0.7), 0 2px 8px rgba(0,0,0,0.7);
    z-index: 50; white-space: nowrap;
    transform: translate(-50%, -50%);
    animation: popup-anim 1.1s ease-out forwards;
    letter-spacing: 0.02em;
  }
  .sd-popup.big {
    font-size: 36px;
    background: linear-gradient(90deg,#ffd60a,#ff453a,#ffd60a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(255,214,10,0.6);
  }
  .sd-popup.warning {
    font-size: 30px; color: #ff453a;
    text-shadow: 0 0 22px rgba(255,69,58,0.9);
  }
  .sd-popup.rainbow {
    background: linear-gradient(90deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: popup-anim 1.4s ease-out forwards, rainbow 2s linear infinite;
    font-size: 32px;
  }
  @keyframes popup-anim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    18% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); }
    100% { opacity: 0; transform: translate(-50%, -170%) scale(0.9); }
  }
  @media (max-width: 380px) {
    body { padding: calc(8px + env(safe-area-inset-top)) 8px env(safe-area-inset-bottom); }
    .sd-top-bar { gap: 6px; padding: 4px 0 8px; }
    .sd-icon-btn, .sd-logo-btn { width: 34px; height: 34px; font-size: 15px; }
    .sd-rise-chip { height: 32px; min-width: 32px; padding: 0 10px; font-size: 13px; border-radius: 16px; }
    .sd-next-chip { width: 32px; height: 32px; }
    .sd-next-chip .sd-tile-mini { width: 30px; height: 30px; font-size: 12px; }
    .sd-tile-mini { border-radius: 5px; }
    .sd-preview-row { min-height: 36px; }
    .sd-overlay-logo { width: 56px; height: 56px; }
    .sd-overlay h2 { font-size: 24px; }
    .sd-overlay-score { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="sd-wrap" tabindex="0">
  <div class="sd-top-bar">
    <button class="sd-logo-btn" id="sd-restart" aria-label="Restart" title="Restart">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ff453a"/>
            <stop offset="20%" stop-color="#ffd60a"/>
            <stop offset="40%" stop-color="#30d158"/>
            <stop offset="60%" stop-color="#64d2ff"/>
            <stop offset="80%" stop-color="#0a84ff"/>
            <stop offset="100%" stop-color="#bf5af2"/>
          </linearGradient>
          <radialGradient id="ls" cx="32%" cy="28%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M50 6 C28 30 14 52 14 68 A36 36 0 0 0 86 68 C86 52 72 30 50 6 Z" fill="url(#lg)"/>
        <path d="M50 6 C28 30 14 52 14 68 A36 36 0 0 0 86 68 C86 52 72 30 50 6 Z" fill="url(#ls)"/>
      </svg>
    </button>
    <div class="sd-score" id="sd-score">0</div>
    <div class="sd-rise-chip" id="sd-stat-rise"><span id="sd-rise">12</span></div>
    <div class="sd-next-chip"><div class="sd-tile-mini" id="sd-next">2</div></div>
    <button class="sd-icon-btn" id="sd-bgm-btn" aria-label="Toggle music">🎵</button>
    <button class="sd-icon-btn" id="sd-sfx-btn" aria-label="Toggle sound effects">🔊</button>
  </div>
  <div class="sd-play-area">
    <div class="sd-preview-row" id="sd-preview"></div>
    <div class="sd-grid-wrap">
      <div class="sd-grid" id="sd-grid"></div>
      <div class="sd-overlay" id="sd-overlay">
        <svg class="sd-overlay-logo" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="olg" x1="20%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#ff453a"/>
              <stop offset="20%" stop-color="#ffd60a"/>
              <stop offset="40%" stop-color="#30d158"/>
              <stop offset="60%" stop-color="#64d2ff"/>
              <stop offset="80%" stop-color="#0a84ff"/>
              <stop offset="100%" stop-color="#bf5af2"/>
            </linearGradient>
            <radialGradient id="ols" cx="32%" cy="28%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
              <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <path d="M50 6 C28 30 14 52 14 68 A36 36 0 0 0 86 68 C86 52 72 30 50 6 Z" fill="url(#olg)"/>
          <path d="M50 6 C28 30 14 52 14 68 A36 36 0 0 0 86 68 C86 52 72 30 50 6 Z" fill="url(#ols)"/>
        </svg>
        <h2>SPECTRUM DROP</h2>
        <p class="sd-overlay-meta">Game Over</p>
        <div class="sd-overlay-score" id="sd-final">0</div>
        <p class="sd-overlay-best">Best <span id="sd-final-best">0</span></p>
        <div class="sd-submit-row" id="sd-submit-row">
          <input type="text" class="sd-name-input" id="sd-name-input" placeholder="YOUR NAME" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
          <button class="sd-submit-btn" id="sd-submit-btn">Submit</button>
        </div>
        <div class="sd-leaderboard" id="sd-leaderboard">
          <p class="sd-leaderboard-title">Top 10 — Global</p>
          <div class="sd-leaderboard-empty">Loading…</div>
        </div>
        <button class="sd-btn" id="sd-overlay-restart">Play Again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  // ===================== AUDIO =====================
  let sfxMuted = localStorage.getItem('sd-sfx-muted') === '1';
  let bgmMuted = localStorage.getItem('sd-bgm-muted') === '1';
  // Migrate legacy single-mute setting
  const _legacyMute = localStorage.getItem('sd-muted');
  if (_legacyMute !== null && localStorage.getItem('sd-sfx-muted') === null) {
    sfxMuted = bgmMuted = (_legacyMute === '1');
    localStorage.setItem('sd-sfx-muted', sfxMuted ? '1' : '0');
    localStorage.setItem('sd-bgm-muted', bgmMuted ? '1' : '0');
    localStorage.removeItem('sd-muted');
  }
  let audioUnlocked = false;
  let stingerEl = null;

  const SFX = {
    hit:       { src: 'audio/sfx-hit.mp3',            vol: 0.45, pool: [] },
    wrong:     { src: 'audio/sfx-wrong.mp3',          vol: 0.50, pool: [] },
    mergeS:    { src: 'audio/sfx-correct-small.mp3',  vol: 0.55, pool: [] },
    mergeM:    { src: 'audio/sfx-correct-medium.mp3', vol: 0.60, pool: [] },
    mergeL:    { src: 'audio/sfx-correct-big.mp3',    vol: 0.70, pool: [] },
    bomb:      { src: 'audio/sfx-item-bomb.mp3',      vol: 0.70, pool: [] },
    wild:      { src: 'audio/sfx-item-freeze.mp3',    vol: 0.60, pool: [] },
    heal:      { src: 'audio/sfx-item-heal.mp3',      vol: 0.65, pool: [] },
    milestone: { src: 'audio/sfx-win.mp3',            vol: 0.55, pool: [] },
    warn:      { src: 'audio/sfx-wave-start.mp3',     vol: 0.55, pool: [] },
    rise:      { src: 'audio/sfx-heart-lose.mp3',     vol: 0.55, pool: [] },
    over:      { src: 'audio/sfx-lose.mp3',           vol: 0.65, pool: [] },
    tap:       { src: 'audio/sfx-ui-tap.mp3',         vol: 0.40, pool: [] }
  };
  const SFX_POOL_SIZE = 3;
  for (const def of Object.values(SFX)) {
    for (let i = 0; i < SFX_POOL_SIZE; i++) {
      const a = new Audio(def.src);
      a.preload = 'auto';
      a.volume = def.vol;
      def.pool.push(a);
    }
  }

  const BGM_TRACKS = [
    'audio/battle-1.mp3', 'audio/battle-2.mp3',
    'audio/battle-3.mp3', 'audio/battle-4.mp3'
  ];
  const BGM_VOL = 0.32;
  const bgmA = new Audio(), bgmB = new Audio();
  bgmA.loop = bgmB.loop = true;
  bgmA.preload = bgmB.preload = 'none';
  let activeBgm = bgmA;
  let bgmFadeRAF = null;

  function sfx(name, opts) {
    if (sfxMuted || !audioUnlocked) return;
    const def = SFX[name];
    if (!def) return;
    let a = def.pool.find(x => x.paused || x.ended);
    if (!a) a = def.pool[0];
    a.playbackRate = (opts && opts.rate) ? opts.rate : 1;
    a.volume = (opts && opts.vol != null) ? opts.vol : def.vol;
    try { a.currentTime = 0; } catch(_) {}
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    const els = [bgmA, bgmB];
    for (const def of Object.values(SFX)) for (const a of def.pool) els.push(a);
    for (const a of els) {
      try {
        a.muted = true;
        const p = a.play();
        if (p && p.then) {
          p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
           .catch(() => { a.muted = false; });
        } else { a.pause(); a.muted = false; }
      } catch(_) { a.muted = false; }
    }
  }

  function playBgm(url) {
    if (!url) return;
    const cur = activeBgm.src;
    if (cur && cur.indexOf(url) !== -1 && !activeBgm.paused) return;
    const next = (activeBgm === bgmA) ? bgmB : bgmA;
    next.src = url;
    next.volume = 0;
    if (bgmMuted) { try { next.pause(); } catch(_){} return; }
    const pp = next.play();
    if (pp && pp.catch) pp.catch(() => {});

    if (bgmFadeRAF) cancelAnimationFrame(bgmFadeRAF);
    const startTime = performance.now();
    const startVolActive = activeBgm.volume;
    const prev = activeBgm;
    function fade() {
      const t = Math.min(1, (performance.now() - startTime) / 600);
      next.volume = BGM_VOL * t;
      prev.volume = startVolActive * (1 - t);
      if (t < 1) {
        bgmFadeRAF = requestAnimationFrame(fade);
      } else {
        try { prev.pause(); } catch(_){}
        activeBgm = next;
        bgmFadeRAF = null;
      }
    }
    fade();
  }

  function stopBgm() {
    if (bgmFadeRAF) cancelAnimationFrame(bgmFadeRAF);
    const target = activeBgm;
    const startTime = performance.now();
    const startVol = target.volume;
    function fade() {
      const t = Math.min(1, (performance.now() - startTime) / 350);
      target.volume = startVol * (1 - t);
      if (t < 1) bgmFadeRAF = requestAnimationFrame(fade);
      else { try { target.pause(); } catch(_){} bgmFadeRAF = null; }
    }
    fade();
  }

  function playStinger(url, vol) {
    if (sfxMuted || !audioUnlocked) return;
    if (!stingerEl) stingerEl = new Audio();
    try {
      stingerEl.src = url;
      stingerEl.volume = vol != null ? vol : 0.5;
      stingerEl.currentTime = 0;
      const p = stingerEl.play();
      if (p && p.catch) p.catch(() => {});
    } catch(_) {}
  }

  function setSfxMuted(m) {
    sfxMuted = m;
    localStorage.setItem('sd-sfx-muted', m ? '1' : '0');
    if (sfxMuted && stingerEl) {
      try { stingerEl.pause(); } catch(_){}
    }
    updateAudioIcons();
  }

  function setBgmMuted(m) {
    bgmMuted = m;
    localStorage.setItem('sd-bgm-muted', m ? '1' : '0');
    if (bgmMuted) {
      bgmA.volume = 0; bgmB.volume = 0;
      try { bgmA.pause(); bgmB.pause(); } catch(_){}
    } else if (activeBgm.src) {
      try {
        const p = activeBgm.play();
        if (p && p.catch) p.catch(() => {});
      } catch(_){}
      activeBgm.volume = BGM_VOL;
    }
    updateAudioIcons();
  }

  function updateAudioIcons() {
    const sfxBtn = document.getElementById('sd-sfx-btn');
    const bgmBtn = document.getElementById('sd-bgm-btn');
    if (sfxBtn) sfxBtn.classList.toggle('off', sfxMuted);
    if (bgmBtn) bgmBtn.classList.toggle('off', bgmMuted);
  }

  function vibe(pat) {
    if (sfxMuted) return;
    if (navigator.vibrate) {
      try { navigator.vibrate(pat); } catch(_){}
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (activeBgm && !activeBgm.paused) {
        activeBgm._wasPlaying = true;
        try { activeBgm.pause(); } catch(_){}
      }
    } else {
      if (activeBgm && activeBgm._wasPlaying && !bgmMuted) {
        try {
          const p = activeBgm.play();
          if (p && p.catch) p.catch(() => {});
        } catch(_){}
        activeBgm._wasPlaying = false;
      }
    }
  });

  // ===================== PARTICLES =====================
  const POOL_SIZE = 90;
  let particlesContainer = null;
  let particlesPool = [];
  let particlesActive = 0;
  let particlesRAF = null;
  let lastParticleT = 0;

  function initParticles() {
    particlesContainer = document.createElement('div');
    particlesContainer.className = 'sd-particle-layer';
    document.querySelector('.sd-grid-wrap').appendChild(particlesContainer);
    for (let i = 0; i < POOL_SIZE; i++) {
      const el = document.createElement('div');
      el.className = 'sd-particle';
      particlesContainer.appendChild(el);
      particlesPool.push({ el, active: false, x:0, y:0, vx:0, vy:0, life:0, ttl:0 });
    }
  }

  function burstAt(r, c, color, count) {
    if (!particlesContainer) initParticles();
    const cell = document.getElementById('sd-cell-' + r + '-' + c);
    if (!cell) return;
    const wRect = document.querySelector('.sd-grid-wrap').getBoundingClientRect();
    const cr = cell.getBoundingClientRect();
    const cx = cr.left - wRect.left + cr.width / 2;
    const cy = cr.top - wRect.top + cr.height / 2;
    const n = count || 10;
    for (let i = 0; i < n; i++) {
      const p = particlesPool.find(p => !p.active);
      if (!p) break;
      p.active = true;
      particlesActive++;
      p.x = cx; p.y = cy;
      const angle = Math.random() * Math.PI * 2;
      const speed = 70 + Math.random() * 170;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed - 100;
      p.life = 0; p.ttl = 0.55 + Math.random() * 0.5;
      p.el.style.background = color;
      p.el.style.boxShadow = '0 0 8px ' + color;
      p.el.style.opacity = '1';
    }
    if (!particlesRAF) particlesRAF = requestAnimationFrame(tickParticles);
  }

  function tickParticles(now) {
    const dt = lastParticleT ? Math.min(0.05, (now - lastParticleT) / 1000) : 0.016;
    lastParticleT = now;
    for (const p of particlesPool) {
      if (!p.active) continue;
      p.vy += 540 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life += dt;
      const lp = p.life / p.ttl;
      if (lp >= 1) {
        p.active = false;
        particlesActive--;
        p.el.style.opacity = '0';
        continue;
      }
      p.el.style.transform = 'translate(' + (p.x - 4) + 'px,' + (p.y - 4) + 'px) scale(' + (1 - lp * 0.6) + ')';
      p.el.style.opacity = String(Math.max(0, 1 - lp));
    }
    if (particlesActive > 0) {
      particlesRAF = requestAnimationFrame(tickParticles);
    } else {
      particlesRAF = null;
      lastParticleT = 0;
    }
  }

  function dropTrail(col) {
    const wrap = document.querySelector('.sd-grid-wrap');
    const cell = document.getElementById('sd-cell-0-' + col);
    if (!cell) return;
    const wRect = wrap.getBoundingClientRect();
    const cr = cell.getBoundingClientRect();
    const x = cr.left - wRect.left + cr.width / 2;
    const trail = document.createElement('div');
    trail.className = 'sd-trail';
    trail.style.left = (x - 2.5) + 'px';
    wrap.appendChild(trail);
    setTimeout(() => trail.remove(), 420);
  }

  // ===================== GAME =====================
  const COLS = 6, ROWS = 10;
  const HEX = {1:'#ff453a',2:'#30d158',4:'#0a84ff',3:'#ffd60a',5:'#bf5af2',6:'#64d2ff',7:'#f5f5f7'};
  const DARK_TEXT = new Set([3, 6, 7]);
  const MENACE_INTERVAL = 10;
  const WARN_THRESHOLD = 3;
  const MILESTONES = [64, 128, 256, 512, 1024, 2048];

  let grid, current, next, score = 0, best = 0, combo = 0;
  let dropsToMenace = MENACE_INTERVAL;
  let gameOver = false, busy = false, hoverCol = 2, built = false;
  let achievements = new Set();

  best = parseInt(localStorage.getItem('sd-best') || '0', 10) || 0;
  function saveBest() { localStorage.setItem('sd-best', String(best)); }

  function currentMenaceInterval() {
    if (score >= 4500) return 5;
    if (score >= 2500) return 6;
    if (score >= 1000) return 8;
    return MENACE_INTERVAL;
  }

  function makeTile() {
    const r = Math.random();
    const wildChance = score >= 4000 ? 0.02 : (score >= 1500 ? 0.03 : 0.04);
    if (r < wildChance) {
      return { wild: true, number: null, color: 7 };
    } else if (r < wildChance + 0.05) {
      const primaries = [1, 2, 4];
      const n = Math.random() < 0.7 ? 2 : 4;
      return { bomb: true, color: primaries[Math.floor(Math.random()*3)], number: n };
    } else {
      const primaries = [1, 2, 4];
      const c = primaries[Math.floor(Math.random() * 3)];
      const rn = Math.random();
      let n;
      if (score >= 4000)      n = rn < 0.45 ? 2 : (rn < 0.78 ? 4 : 8);
      else if (score >= 2000) n = rn < 0.55 ? 2 : (rn < 0.88 ? 4 : 8);
      else if (score >= 800)  n = rn < 0.65 ? 2 : (rn < 0.97 ? 4 : 8);
      else                    n = rn < 0.75 ? 2 : 4;
      return { color: c, number: n };
    }
  }

  function makeRiseTile() {
    const primaries = [1, 2, 4];
    const blends = [3, 5, 6];
    const useBlend = score >= 3000 && Math.random() < (score >= 5000 ? 0.2 : 0.1);
    const color = useBlend
      ? blends[Math.floor(Math.random() * 3)]
      : primaries[Math.floor(Math.random() * 3)];
    const n = (score >= 3000 && Math.random() < 0.25) ? 4 : 2;
    return { color, number: n };
  }

  function findClusters() {
    const seen = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    const out = [];
    for (let sr = 0; sr < ROWS; sr++) {
      for (let sc = 0; sc < COLS; sc++) {
        if (seen[sr][sc] || !grid[sr][sc]) continue;
        if (grid[sr][sc].wild) continue;
        const num = grid[sr][sc].number;
        const cluster = new Set();
        let colorMask = grid[sr][sc].color;
        cluster.add(sr * COLS + sc);

        function tryAdd(r, c) {
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
          const key = r * COLS + c;
          if (cluster.has(key)) return false;
          if (seen[r][c]) return false;
          const t = grid[r][c];
          if (!t) return false;
          if (t.wild || (t.number === num && (t.color & colorMask) !== 0)) {
            cluster.add(key);
            colorMask |= t.color;
            return true;
          }
          return false;
        }

        let changed = true;
        while (changed) {
          changed = false;
          const snapshot = Array.from(cluster);
          for (const key of snapshot) {
            const r = Math.floor(key / COLS), c = key % COLS;
            for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
              if (tryAdd(r + dr, c + dc)) changed = true;
            }
          }
        }

        const tiles = [];
        for (const key of cluster) {
          const r = Math.floor(key / COLS), c = key % COLS;
          seen[r][c] = true;
          tiles.push([r, c]);
        }
        if (tiles.length >= 2) out.push({ tiles, baseNum: num });
      }
    }
    return out;
  }

  function mergeClusters(clusters) {
    let gained = 0;
    const bombs = [];
    for (const cl of clusters) {
      const tiles = cl.tiles;
      const base = cl.baseNum;
      let mask = 0, hasBomb = false, hasWild = false;
      for (const [r, c] of tiles) {
        const t = grid[r][c];
        mask |= t.color;
        if (t.bomb) hasBomb = true;
        if (t.wild) hasWild = true;
      }
      let tgt = tiles[0];
      for (const p of tiles) {
        if (p[0] > tgt[0] || (p[0] === tgt[0] && p[1] > tgt[1])) tgt = p;
      }
      for (const [r, c] of tiles) grid[r][c] = null;
      const newVal = base * Math.pow(2, tiles.length - 1);
      const newTile = { color: mask, number: newVal, _new: true };
      if (hasBomb) newTile.bomb = true;
      grid[tgt[0]][tgt[1]] = newTile;
      const colorBits = (mask & 1) + ((mask >> 1) & 1) + ((mask >> 2) & 1);
      const blendMult = colorBits === 3 ? 3 : (colorBits === 2 ? 1.5 : 1);
      const isWhite = blendMult === 3;
      let mergeScore = newVal * tiles.length;
      if (hasWild) mergeScore *= 2;
      mergeScore = Math.round(mergeScore * blendMult);
      gained += mergeScore;
      if (hasBomb) bombs.push(tgt);

      const partColor = HEX[mask] || '#fff';
      const partCount = 6 + Math.min(16, tiles.length * 3) + (isWhite ? 12 : blendMult === 1.5 ? 4 : 0);
      burstAt(tgt[0], tgt[1], partColor, partCount);
      vibe(isWhite ? 45 : 25);

      const rate = Math.min(1.55, 1 + Math.max(0, combo - 1) * 0.13);
      let popupText, popupStyle;
      if (hasWild) {
        sfx('wild');
        popupText = 'WILD! +' + mergeScore;
        popupStyle = 'rainbow';
      } else {
        if (tiles.length >= 4) popupText = 'ULTRA ×' + tiles.length + ' +' + mergeScore;
        else if (tiles.length >= 3) popupText = 'MEGA +' + mergeScore;
        else popupText = '+' + mergeScore;
        if (isWhite) {
          sfx('mergeL', { rate });
          sfx('milestone', { vol: 0.4 });
          popupText += ' ❋×3';
          popupStyle = 'rainbow';
        } else if (blendMult === 1.5) {
          sfx(tiles.length >= 3 ? 'mergeM' : 'mergeS', { rate });
          popupText += ' ×1.5';
          popupStyle = tiles.length >= 3 ? 'big' : null;
        } else {
          if (tiles.length >= 4) sfx('mergeL', { rate });
          else if (tiles.length >= 3) sfx('mergeM', { rate });
          else sfx('mergeS', { rate });
          popupStyle = tiles.length >= 4 ? 'big' : (tiles.length >= 3 ? 'big' : null);
        }
      }
      showPopup(popupText, tgt, popupStyle);

      if (mask === 7 && !achievements.has('white')) {
        achievements.add('white');
        setTimeout(() => showPopup('FIRST WHITE!', null, 'rainbow'), 200);
        flashScreen();
        sfx('heal');
        playStinger('audio/bgm-win.mp3', 0.55);
      }
      for (const mile of MILESTONES) {
        if (newVal >= mile && !achievements.has('m' + mile)) {
          achievements.add('m' + mile);
          setTimeout(() => showPopup(mile + '!', null, 'big'), 400);
          sfx('milestone');
          if (mile >= 512) playStinger('audio/bgm-win.mp3', 0.45);
        }
      }
    }
    for (const [r, c] of bombs) {
      let bombScore = 0, cleared = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if (grid[nr][nc]) {
          bombScore += grid[nr][nc].number * 2;
          burstAt(nr, nc, HEX[grid[nr][nc].color] || '#fff', 8);
          grid[nr][nc] = null;
          cleared++;
        }
      }
      if (grid[r][c]) grid[r][c].bomb = false;
      gained += bombScore;
      if (cleared > 0) {
        sfx('bomb');
        vibe([30, 20, 30]);
        shakeBoard();
        showPopup('💥 +' + bombScore, [r, c], 'warning');
      }
    }
    return gained;
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let w = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c]) {
          if (r !== w) {
            grid[w][c] = grid[r][c];
            grid[r][c] = null;
          }
          w--;
        }
      }
    }
  }

  function init() {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    current = makeTile();
    next = makeTile();
    score = 0; combo = 0;
    dropsToMenace = currentMenaceInterval();
    achievements = new Set();
    gameOver = false; busy = false;
    document.getElementById('sd-overlay').style.display = 'none';
    document.getElementById('sd-grid').classList.remove('warning');
    if (stingerEl) try { stingerEl.pause(); } catch(_){}
    if (audioUnlocked) {
      const url = BGM_TRACKS[Math.floor(Math.random() * BGM_TRACKS.length)];
      playBgm(url);
    }
    render();
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function resolveCascades() {
    let totalGain = 0;
    while (true) {
      const clusters = findClusters();
      if (clusters.length === 0) break;
      combo++;
      if (combo >= 2) {
        showPopup('COMBO ×' + combo, null, combo >= 4 ? 'rainbow' : 'big');
      }
      const g = mergeClusters(clusters);
      totalGain += g * combo;
      render();
      await sleep(280);
      applyGravity();
      render();
      await sleep(170);
    }
    return totalGain;
  }

  async function drop(col) {
    if (gameOver || busy) return;
    let landed = -1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (!grid[r][col]) { landed = r; break; }
    }
    if (landed < 0) { shakeColumn(col); sfx('wrong'); vibe(40); return; }

    busy = true;
    dropTrail(col);
    sfx('hit');
    vibe(10);
    grid[landed][col] = Object.assign({}, current, { _new: true });
    combo = 0;
    render();
    await sleep(130);

    let totalGain = await resolveCascades();
    score += totalGain;
    if (score > best) { best = score; saveBest(); }
    updateStats();
    if (totalGain > 0) pulseScore();

    if (grid[0].some(t => t !== null)) return endGame();

    current = next;
    next = makeTile();
    combo = 0;
    dropsToMenace--;

    if (dropsToMenace <= 0) {
      dropsToMenace = currentMenaceInterval();
      await triggerMenace();
      if (gameOver) return;
    }

    busy = false;
    render();
  }

  async function triggerMenace() {
    if (grid[0].some(t => t !== null)) return endGame();
    shakeBoard();
    sfx('warn');
    vibe([20, 30, 20]);
    showPopup('FLOOR RISING!', null, 'warning');
    await sleep(450);

    for (let r = 0; r < ROWS - 1; r++) grid[r] = grid[r + 1];
    const newRow = [];
    for (let c = 0; c < COLS; c++) {
      if (Math.random() < 0.5) {
        const t = makeRiseTile();
        t._new = true;
        newRow.push(t);
      } else newRow.push(null);
    }
    grid[ROWS-1] = newRow;
    sfx('rise');
    vibe([15, 30, 15]);
    render();
    await sleep(380);

    combo = 0;
    const gain = await resolveCascades();
    score += gain;
    if (score > best) { best = score; saveBest(); }
    updateStats();

    if (grid[0].some(t => t !== null)) return endGame();
  }

  // ===================== LEADERBOARD =====================
  const LB_API = '/api/scores';
  let leaderboard = [];
  let lastSubmittedScore = -1;

  async function loadLeaderboard() {
    try {
      const r = await fetch(LB_API, { cache: 'no-store' });
      if (!r.ok) throw new Error('GET ' + r.status);
      leaderboard = await r.json();
    } catch (e) {
      leaderboard = [];
      throw e;
    }
  }

  function qualifies(s) {
    if (s < 1) return false;
    if (leaderboard.length < 10) return true;
    return s > leaderboard[leaderboard.length - 1].score;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderLeaderboard(highlightName) {
    const el = document.getElementById('sd-leaderboard');
    let html = '<p class="sd-leaderboard-title">Top 10 — Global</p>';
    if (!leaderboard.length) {
      html += '<div class="sd-leaderboard-empty">No scores yet — be first!</div>';
    } else {
      html += leaderboard.map((s, i) => {
        const isYou = highlightName && s.name === highlightName && s.score === lastSubmittedScore;
        return '<div class="sd-leaderboard-row' + (isYou ? ' you' : '') + '">' +
          '<span class="sd-leaderboard-rank">' + (i + 1) + '</span>' +
          '<span class="sd-leaderboard-name">' + escapeHtml(s.name) + '</span>' +
          '<span class="sd-leaderboard-score">' + s.score.toLocaleString() + '</span>' +
          '</div>';
      }).join('');
    }
    el.innerHTML = html;
  }

  async function submitNameClicked() {
    const input = document.getElementById('sd-name-input');
    const btn = document.getElementById('sd-submit-btn');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch(LB_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, score })
      });
      if (!r.ok) throw new Error('POST ' + r.status);
      leaderboard = await r.json();
      lastSubmittedScore = score;
      localStorage.setItem('sd-last-name', name);
      document.getElementById('sd-submit-row').classList.remove('show');
      btn.textContent = '✓';
      renderLeaderboard(name);
      sfx('milestone');
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Retry';
    }
  }

  function endGame() {
    gameOver = true; busy = false;
    saveBest();
    document.getElementById('sd-final').textContent = score.toLocaleString();
    document.getElementById('sd-final-best').textContent = best.toLocaleString();
    const submitRow = document.getElementById('sd-submit-row');
    const submitBtn = document.getElementById('sd-submit-btn');
    submitRow.classList.remove('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit';
    document.getElementById('sd-leaderboard').innerHTML =
      '<p class="sd-leaderboard-title">Top 10 — Global</p><div class="sd-leaderboard-empty">Loading…</div>';
    const nameInput = document.getElementById('sd-name-input');
    const savedName = localStorage.getItem('sd-last-name');
    if (savedName) nameInput.value = savedName;
    document.getElementById('sd-overlay').style.display = 'flex';
    sfx('over');
    vibe([40, 30, 40, 30, 80]);
    setTimeout(() => playBgm('audio/bgm-lose.mp3'), 250);

    loadLeaderboard().then(() => {
      renderLeaderboard();
      if (qualifies(score)) {
        submitRow.classList.add('show');
      }
    }).catch(() => {
      document.getElementById('sd-leaderboard').innerHTML =
        '<p class="sd-leaderboard-title">Top 10 — Global</p>' +
        '<div class="sd-leaderboard-empty">Leaderboard unavailable</div>';
    });
  }

  function shakeBoard() {
    const w = document.getElementById('sd-grid');
    w.classList.remove('shaking'); void w.offsetWidth;
    w.classList.add('shaking');
    setTimeout(() => w.classList.remove('shaking'), 500);
  }

  function shakeColumn(col) {
    for (let r = 0; r < ROWS; r++) {
      const cell = document.getElementById('sd-cell-' + r + '-' + col);
      if (!cell) continue;
      cell.classList.remove('sd-flash'); void cell.offsetWidth;
      cell.classList.add('sd-flash');
    }
  }

  function flashScreen() {
    document.body.classList.remove('flashing'); void document.body.offsetWidth;
    document.body.classList.add('flashing');
    setTimeout(() => document.body.classList.remove('flashing'), 700);
  }

  function pulseScore() {
    const el = document.getElementById('sd-score');
    el.classList.remove('sd-pulse'); void el.offsetWidth;
    el.classList.add('sd-pulse');
  }

  function showPopup(text, target, style) {
    const popup = document.createElement('div');
    popup.className = 'sd-popup';
    if (style) popup.classList.add(style);
    popup.textContent = text;
    const wrap = document.querySelector('.sd-grid-wrap');
    if (target && Array.isArray(target)) {
      const [r, c] = target;
      const rect = wrap.getBoundingClientRect();
      const cellW = rect.width / COLS;
      const cellH = rect.height / ROWS;
      popup.style.left = (cellW * (c + 0.5)) + 'px';
      popup.style.top = (cellH * (r + 0.5)) + 'px';
    } else {
      popup.style.left = '50%';
      popup.style.top = '40%';
    }
    wrap.appendChild(popup);
    setTimeout(() => popup.remove(), 1400);
  }

  function buildGrid() {
    const g = document.getElementById('sd-grid');
    g.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'sd-cell';
        cell.id = 'sd-cell-' + r + '-' + c;
        g.appendChild(cell);
      }
    }
    const p = document.getElementById('sd-preview');
    p.innerHTML = '';
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'sd-preview-cell';
      cell.id = 'sd-preview-' + c;
      p.appendChild(cell);
    }
    built = true;
  }

  function applyTileMini(el, t) {
    el.className = 'sd-tile-mini';
    el.style.background = ''; el.style.color = ''; el.style.fontSize = '';
    el.textContent = '';
    if (!t) return;
    if (t.wild) {
      el.classList.add('wild');
      el.textContent = '★';
    } else {
      el.style.background = HEX[t.color];
      el.style.color = DARK_TEXT.has(t.color) ? '#1c1c1e' : '#fff';
      el.textContent = t.number;
      if (t.bomb) el.classList.add('bomb');
    }
  }

  function renderPreview() {
    for (let c = 0; c < COLS; c++) {
      const cell = document.getElementById('sd-preview-' + c);
      if (!cell) continue;
      if (c === hoverCol && !gameOver && !busy) {
        cell.classList.add('active');
        if (current.wild) {
          cell.style.background = 'linear-gradient(45deg,#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a)';
          cell.style.backgroundSize = '400% 400%';
          cell.style.animation = 'rainbow 2.5s linear infinite, bob 1.4s ease-in-out infinite';
          cell.style.color = '#fff';
          cell.textContent = '★';
          cell.style.boxShadow = '0 4px 14px rgba(255,255,255,0.4)';
        } else {
          cell.style.background = HEX[current.color];
          cell.style.color = DARK_TEXT.has(current.color) ? '#1c1c1e' : '#fff';
          cell.style.boxShadow = '0 4px 14px ' + HEX[current.color] + '66, inset 0 1px 0 rgba(255,255,255,0.3)';
          cell.textContent = current.number;
          cell.style.animation = '';
          if (current.bomb) {
            cell.style.boxShadow = '0 0 0 2px #ff453a, 0 4px 14px rgba(255,69,58,0.6)';
          }
        }
      } else {
        cell.classList.remove('active');
        cell.style.background = ''; cell.style.boxShadow = '';
        cell.style.animation = ''; cell.textContent = '';
      }
    }
  }

  function fontSizeFor(n) {
    const len = String(n).length;
    if (len >= 5) return '0.6em';
    if (len === 4) return '0.72em';
    if (len === 3) return '0.85em';
    return '1em';
  }

  function updateStats() {
    document.getElementById('sd-score').textContent = score.toLocaleString();
    document.getElementById('sd-rise').textContent = dropsToMenace;
    const riseStat = document.getElementById('sd-stat-rise');
    if (dropsToMenace <= WARN_THRESHOLD) riseStat.classList.add('rise-warn');
    else riseStat.classList.remove('rise-warn');
    const gridEl = document.getElementById('sd-grid');
    if (dropsToMenace <= 1) gridEl.classList.add('warning');
    else gridEl.classList.remove('warning');
    applyTileMini(document.getElementById('sd-next'), next);
  }

  function render() {
    if (!built) buildGrid();
    updateStats();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.getElementById('sd-cell-' + r + '-' + c);
        const t = grid[r][c];
        const sig = t ? (t.color + '-' + t.number + '-' + (t.wild?1:0) + '-' + (t.bomb?1:0)) : '';
        const isNew = t && t._new;
        if (cell.dataset.sig === sig && !isNew) continue;
        cell.dataset.sig = sig;
        cell.innerHTML = '';
        if (t) {
          const tile = document.createElement('div');
          tile.className = 'sd-tile';
          if (isNew) tile.classList.add('new');
          if (t.wild) {
            tile.classList.add('wild');
            tile.textContent = '★';
          } else {
            tile.style.background = HEX[t.color];
            tile.style.color = DARK_TEXT.has(t.color) ? '#1c1c1e' : '#fff';
            tile.style.fontSize = fontSizeFor(t.number);
            tile.textContent = t.number;
            if (t.bomb) tile.classList.add('bomb');
          }
          cell.appendChild(tile);
          if (isNew) delete t._new;
        }
      }
    }
    renderPreview();
  }

  // ===================== INPUT =====================
  function colFromX(x) {
    const grid = document.getElementById('sd-grid');
    const rect = grid.getBoundingClientRect();
    let best = 0, bestDist = Infinity;
    for (let c = 0; c < COLS; c++) {
      const cell = document.getElementById('sd-cell-' + (ROWS - 1) + '-' + c);
      if (!cell) {
        const colW = rect.width / COLS;
        return Math.max(0, Math.min(COLS - 1, Math.floor((x - rect.left) / colW)));
      }
      const cr = cell.getBoundingClientRect();
      const cx = cr.left + cr.width / 2;
      const d = Math.abs(x - cx);
      if (d < bestDist) { bestDist = d; best = c; }
    }
    return best;
  }

  let pointerStart = null;
  function setupInput() {
    const playArea = document.querySelector('.sd-play-area');

    function isOverlayTarget(e) {
      return gameOver || (e.target && e.target.closest && e.target.closest('.sd-overlay'));
    }

    playArea.addEventListener('pointerdown', (e) => {
      if (isOverlayTarget(e)) return;
      unlockAudio();
      pointerStart = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      hoverCol = colFromX(e.clientX);
      renderPreview();
      try { playArea.setPointerCapture(e.pointerId); } catch(_){}
      e.preventDefault();
    });

    playArea.addEventListener('pointermove', (e) => {
      if (isOverlayTarget(e)) return;
      const newCol = colFromX(e.clientX);
      if (newCol !== hoverCol) {
        hoverCol = newCol;
        renderPreview();
      }
    });

    playArea.addEventListener('pointerup', (e) => {
      if (!pointerStart) return;
      pointerStart = null;
      try { playArea.releasePointerCapture(e.pointerId); } catch(_){}
      hoverCol = colFromX(e.clientX);
      drop(hoverCol);
    });

    playArea.addEventListener('pointercancel', () => { pointerStart = null; });

    document.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'm' || e.key === 'M') {
        unlockAudio();
        const newState = !(sfxMuted && bgmMuted);
        setSfxMuted(newState); setBgmMuted(newState);
        if (!newState) sfx('tap');
        e.preventDefault();
        return;
      }
      if (gameOver) {
        if (e.key === 'r' || e.key === 'R' || e.key === ' ' || e.key === 'Enter') {
          unlockAudio(); sfx('tap'); stopBgm(); init();
          e.preventDefault();
        }
        return;
      }
      if (e.key === 'ArrowLeft') {
        hoverCol = (hoverCol <= 0) ? COLS - 1 : hoverCol - 1;
        renderPreview(); e.preventDefault();
      } else if (e.key === 'ArrowRight') {
        hoverCol = (hoverCol >= COLS - 1) ? 0 : hoverCol + 1;
        renderPreview(); e.preventDefault();
      } else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') {
        unlockAudio();
        drop(hoverCol); e.preventDefault();
      } else if (e.key === 'r' || e.key === 'R') {
        unlockAudio(); sfx('tap'); init();
      }
    });

    document.getElementById('sd-restart').addEventListener('click', () => {
      unlockAudio(); sfx('tap'); stopBgm(); init();
    });
    document.getElementById('sd-overlay-restart').addEventListener('click', () => {
      unlockAudio(); sfx('tap'); stopBgm(); init();
    });

    document.getElementById('sd-sfx-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      unlockAudio();
      setSfxMuted(!sfxMuted);
      if (!sfxMuted) sfx('tap');
    });
    document.getElementById('sd-bgm-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      unlockAudio();
      setBgmMuted(!bgmMuted);
      if (!sfxMuted) sfx('tap');
    });

    document.getElementById('sd-submit-btn').addEventListener('click', submitNameClicked);
    document.getElementById('sd-name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitNameClicked(); }
    });

    updateAudioIcons();
  }

  setupInput();
  init();
})();
</script>
</body>
</html>
